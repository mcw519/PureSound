# Recipe schema v2: `task` selects the model that validates this file
# (puresound/config/recipe.py); `purpose` picks training vs model-only.
schema_version: 2
purpose: train
task: speaker_embedding

dataset:
  train_metafile: ./data/train
  valid_metafile: ./data/valid
  test_folder: ./data/test
  proc_output_folder: ./proc
  target_sample_rate: 32000
  gain_normalized_to: # ex: -28
  training_length_seconds: 6.
  filter_min_utterance_length: 4.
  filter_min_utterance_per_speaker: 5

augmentation_speech:
  used: False
  is_target: False
  prob: 0.5
  add_n_cases: 2
  snr_range:
    - -10
    - 10
  
augmentation_noise:
  used: False
  prob: 0.5
  noise_folder:
  snr_range:
    - -10
    - 10
  prob_white_noise: 0. # prob. of augmentation replaced by white noise
  white_noise_snr_range:
    - 10
    - 30

augmentation_reverb:
  used: False
  prob: 0.5
  rir_folder:
  target_rir_type: "full" # ["full", "early", "direct", "anechoic"]

# This type is for SV task
augmentation_speed:
  used: False
  prob: 0.5
  treat_as_new_speaker: False
  speed_change:
    - 0.9
    - 1.1

# This type is for NS task
# augmentation_speed:
#   used: False
#   prob: 0.5
#   speed_range:
#     - 0.9
#     - 1.1

augmentation_ir_response:
  used: False
  prob: 0.5

augmentation_src:
  used: False
  prob: 0.5
  src_range:
    - 8000
    - 16000
    - 24000
    - 32000
    - 44100
    - 48000
  prob_each:
    - 0.2
    - 0.3
    - 0.15
    - 0.15
    - 0.1
    - 0.1

augmentation_hpf:
  used: False
  prob: 0.25
  cutoff:
    - 100
    - 200
    - 300
    - 600
    - 800
  prob_each:
    - 0.2
    - 0.3
    - 0.3
    - 0.1
    - 0.1

augmentation_volume:
  used: False
  prob: 0.5
  perturbed_range:
    - 0.2
    - 1.2
  clipping_prob: 0.5
  clipping_range:
    min:
      - 0.
      - 0.1
    max:
      - 0.9
      - 1.0

trainer:
  lightning_trainer_args:
    max_epochs: 200
    gradient_clip_val: 5.
    accumulate_grad_batches: 1
  train_iter_per_epoch: 1000
  valid_iter_per_epoch: 200
  n_spk_per_batch: 5
  n_utt_per_speaker: 4
  num_workers: 20
  num_gpus: 2
  work_folder: ./exp/work

optimizer:
  type: AdamW
  learning_rate: 0.01
  args:
    weight_decay: 0.001
    betas:
     - 0.9
     - 0.999

scheduler:
  type: StepLR
  warmup_step: 1
  args:
    step_size: 10
    gamma: 0.5

loss_func:
  # The first loss func
  - type: Loss-1
    weighted: 1.
    args:
      
  # The second loss func
  - type: Loss-2
    weighted: 1.
    args:
      
model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex
      encoder_lr_factor: 1.
      feats_lr_factor: 1.
      backbone_lr_factor: 1.
  encoder:
    type: ConvEncDec
    encoder_args:
  freq_eq:
    type: FrequencyEQLayer
    eq_args:
      n_fft: 1024
      sample_rate: 32000
      eq_band_gain: 
        - 2.5
        - 5.5
        - 3.25
        - 2.5
        - -2
        - -4
        - -6
        - -10
      eq_band_cutoff:
        - 500
        - 1000
        - 1500
        - 2500
        - 3500
        - 5500
        - 8500
        - 12000
      eq_band_q_factor:
        - 0.707
        - 0.707
        - 0.707
        - 0.707
        - 0.707
        - 0.707
        - 0.707
        - 0.707
      low_shelf_gain_dB: 0.
      low_shelf_cutoff_freq: 80.
      low_shelf_q_factor: 0.707
      high_shelf_gain_dB: -20
      high_shelf_cutoff_freq: 15000
      high_shelf_q_factor: 0.707
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: True
    specaug_args:
      freq_mask_length: 20
      time_mask_length: 20
      fill_value: 0.
      f_dim: 2
      t_dim: 3
      n_freq_mask: 1
      n_time_mask: 2
      prob: 0.5
  backbone:
    type:
    backbone_args:
      