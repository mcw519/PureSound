dataset:
  train_metafile: ./data/libri_train
  valid_metafile: ./data/libri_valid
  test_folder: ./eval
  proc_output_folder: ./proc
  target_sample_rate: 16000
  gain_normalized_to: -28
  training_length_seconds: 6.
  filter_min_utterance_length: 4.
  filter_min_utterance_per_speaker: 5.

enroll_speech:
  enroll_length_seconds: 6
  gain_normalized_to: -28
  add_inactive_target:
    used: False
    prob: 0.1
  add_noise:
    used: True
    prob: 0.5
    noise_folder: noise_folder_path
    snr_range:
      - 10
      - 30
    prob_white_noise: 0.1 # prob. of augmentation replaced by white noise
    white_noise_snr_range:
      - 10
      - 30
  add_reverb:
    used: False
    prob: 0.5
    rir_folder: rir_folder_path
    target_rir_type: "full" # ["full", "early", "direct", "anechoic"]
    simulator:
      used: False
      source_level: False
      room_dim_range:
        - [3.0, 8.0]
        - [3.0, 8.0]
        - [2.4, 3.5]
      rt60_range: [0.15, 0.8]
      source_receiver_distance_range: [0.3, 4.0]
      foreground_distance_range: [0.3, 1.2]
      interferer_distance_range: [1.2, 4.0]
      receiver_margin: 0.4
      source_margin: 0.4
      nsample: 4096
      order: -1
      hp_filter: True
  add_volume:
    used: False
    prob: 0.5
    perturbed_range:
      - 0.2
      - 1.2
    clipping_prob: 0.1
    clipping_range:
      min:
        - 0.
        - 0.1
      max:
        - 0.9
        - 1.0
  add_ir_response:
    used: False
    prob: 0.5

augmentation_speech:
  used: True
  is_target: False
  prob: 1.
  add_n_cases: 2
  snr_range:
    - -20
    - 20
  
augmentation_noise:
  used: False
  prob: 0.5
  noise_folder: noise_folder_path
  snr_range:
    - -10
    - 30
  prob_white_noise: 0.1 # prob. of augmentation replaced by white noise
  white_noise_snr_range:
    - 10
    - 30

augmentation_reverb:
  used: False
  prob: 0.5
  rir_folder: rir_folder_path
  target_rir_type: "early" # ["full", "early", "direct", "anechoic"]
  simulator:
    used: False
    source_level: True
    room_dim_range:
      - [3.0, 8.0]
      - [3.0, 8.0]
      - [2.4, 3.5]
    rt60_range: [0.15, 0.8]
    source_receiver_distance_range: [0.3, 4.0]
    foreground_distance_range: [0.3, 1.2]
    interferer_distance_range: [1.2, 4.0]
    receiver_margin: 0.4
    source_margin: 0.4
    nsample: 4096
    order: -1
    hp_filter: True

augmentation_speed:
  used: False
  prob: 0.5
  speed_range:
    - 0.9
    - 1.1

augmentation_ir_response:
  used: False
  prob: 0.5

augmentation_src:
  used: False
  prob: 0.5
  src_range:
    - 8000
    - 16000
    - 24000
    - 32000
    - 44100
    - 48000
  prob_each:
    - 0.2
    - 0.3
    - 0.15
    - 0.15
    - 0.1
    - 0.1

augmentation_hpf:
  used: False
  prob: 0.25
  cutoff:
    - 100
    - 200
    - 300
    - 600
    - 800
  prob_each:
    - 0.2
    - 0.3
    - 0.3
    - 0.1
    - 0.1

augmentation_volume:
  used: False
  prob: 0.5
  perturbed_range:
    - 0.2
    - 1.2
  clipping_prob: 0. # 0.1
  clipping_range:
    min:
      - 0.
      - 0.1
    max:
      - 0.9
      - 1.0

vad_label:
  used: True
  backend: silero
  args:
    frame_length: 400
    hop_length: 160
    threshold: 0.5
    min_overlap: 0.5
    model_sample_rate: 16000

trainer:
  lightning_trainer_args:
    max_epochs: 200
    gradient_clip_val: 1.
    accumulate_grad_batches: 1
  train_iter_per_epoch: 1000
  valid_iter_per_epoch: 100
  n_spk_per_batch: 6
  n_utt_per_speaker: 1
  num_workers: 40
  num_gpus: 2
  work_folder: ./exp/dpcrn

optimizer:
  type: AdamW
  learning_rate: 0.001
  args:
    weight_decay: 0.00001
    betas:
     - 0.9
     - 0.999

scheduler:
  type: CosineAnnealingWarmRestarts
  warmup_step: -1
  args:
    T_0: 200
    T_mult: 1
    eta_min: 0.00001

signal_loss_func:
  # The first loss func: t-SDR (50ths)
  - type: SDRLoss
    weighted: 1
    args:
      scaled: False
      scale_dependent: False
      zero_mean: True
      source_aggregated: False
      sdr_max: 50

  # VAD-driven objective: suppress non-target/background activity while
  # preserving foreground-active frames.
  - type: VADActivityLoss
    weighted: 0.1
    args:
      frame_length: 400
      hop_length: 160
      activity_threshold_db: -40
      false_positive_weight: 2.0
      false_negative_weight: 1.0
  
class_loss_func:
  # The first loss func
  - type: AAMsoftmax
    weighted: 1
    args:
      embedding_dim: 192
      n_classes: 1172
      margin: 0.3
      scale: 30
      
model:
  lightning_module:
    type: EncDecCondMaskBase
    module_args:
      mask_type: complex
      encoder_lr_factor: 1.
      feats_lr_factor: 1.
      backbone_lr_factor: 1.
      c_encoder_lr_factor: 1.
      c_feats_lr_factor: 1.
      c_backbone_lr_factor: 1.
      jointed_trained: True
      siamese_encoder: False
      siamese_feats: False
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  c_encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      preemphasis: 0.97
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    normalized_mode:
    include_specaug: False
    specaug_args:
      freq_mask_length: 20
      time_mask_length: 20
      fill_value: 0.
      f_dim: 2
      t_dim: 3
      n_freq_mask: 1
      n_time_mask: 2
      prob: 0.5
  c_features:
    feats_type: fbank80_16k
    drop_stft_first_bin: True
    trainable: False
    # Left off deliberately: FeatureEncoder.normalized_mode was silently a
    # no-op until it was fixed, so any checkpoint trained from this frozen
    # legacy recipe saw un-normalized features despite this config once
    # reading `all_feature`. Turn it on only together with a retrain.
    normalized_mode:
    include_specaug: False
    specaug_args:
      freq_mask_length: 4
      time_mask_length: 3
      fill_value: 0.
      n_freq_mask: 3
      n_time_mask: 5
      prob: 0.5
  backbone:
    type: DPCRN
    backbone_args:
      input_dim: 256
      dvec_dim: 192
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels:
        - 2
        - 32
        - 32
        - 32
        - 64
        - 128
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t:
        - 2
        - 2
        - 2
        - 2
        - 2
      stride_t:
        - 1
        - 1
        - 1
        - 1
        - 1
      dilation_t:
        - 1
        - 1
        - 1
        - 1
        - 1
      kernel_f:
        - 5
        - 3
        - 3
        - 3
        - 3
      stride_f:
        - 2
        - 2
        - 1
        - 1
        - 1
      dilation_f:
        - 1
        - 1
        - 1
        - 1
        - 1
      delay:
        - 0
        - 0
        - 0
        - 0
        - 0
      rnn_hidden: 128
      spectral_compress: False
  c_backbone:
    type: EcapaTdnnExtractor
    pretrained_ckpt:
    backbone_args:
      input_size: 80
      embedding_size: 192
      model_scale: 8
      ndim: 1024
      att_size: 1536
