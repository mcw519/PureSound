# voice_isolate -- DPCRN, dpcrn_curriculum_v1: the single-run lineage, next step.
#
# Warm-starts from `pretrained_ckpt/dpcrn_curriculum_v0.ckpt` and keeps that
# model's data recipe exactly where its schedule ended (the values below are
# constants now: room pool, real-recording rows, capture realism, mixed row
# lengths). What this step adds is one axis: multi-turn SESSION rows, with the
# proximity-ordering and frame-presence supervision that reads them. The new
# axis arrives on a schedule (`curriculum`), not as a switch: a warm-started
# model handed a new row type and a new loss at full strength on step one spends
# the top of its first cosine cycle absorbing the change instead of learning
# from it.
#
# WHAT MOVES
#
#   epoch          0 ---- 4 ---- 8 ------ 12 ---------------------- 39
#   session rows   0 ---------> 0.5   (share of eligible long rows)
#   proximity      .    0 ------------> 0.1   (loss weight; waits for rows to exist)
#
# Everything else is a constant. The frame-presence head and its loss are on
# from epoch 0: the head is new, so it starts from init either way, and its
# label (the energy VAD target) exists on every row, not only on session rows.
#
# WHAT DOES NOT MOVE, AND WHY
#
# A model cannot grow a head mid-run, so `proximity_head` and `vad_head` exist
# from step one; the proximity head's WEIGHT is what ramps. The file's constants
# are the schedule's FINAL values, so the validation set -- which reads the file
# and never follows a schedule -- measures the distribution this run ends on.
#
# Lineage: dpcrn_curriculum_v0 (cold, 120 epochs, `train_dpcrn_curriculum.yaml`)
#   -> this. Judge against v0's own ep99 block with the same protocol
#   (5-checkpoint field block, the nine-stage gate) plus the fixed 12 s / 30 s
#   session artefacts (benchmarks/probes/v20_session_rows/session_validation.py).
#
# Run from the recipe directory:
#   cd egs/voice_isolate
#   uv run python main.py config/exp/train_dpcrn_curriculum_v1.yaml --training \
#       --pretrained_ckpt_path pretrained_ckpt/dpcrn_curriculum_v0.ckpt
#
# --pretrained_ckpt_path, not --ckpt_path: the model gained parameters, so the
# checkpoint loads non-strict and the optimiser starts fresh. Resume an
# INTERRUPTION of this run with --ckpt_path on its own latest checkpoint.
#
# The scheduler restarts every 20 epochs; judge only at the troughs (ep19/39).
schema_version: 2
purpose: train
task: voice_isolation

dataset:
  # The long-utterance metafile: the 30 s length bucket needs rows that exist at
  # that length, and the shorter buckets crop from the same corpus.
  train_metafile: data/dns5-read.chapters.train.list
  valid_metafile: data/dns5-read.chapters.dev.list
  test_folder: data/test
  proc_output_folder: proc
  target_sample_rate: 16000
  gain_normalized_to: -28
  training_length_seconds: 6.   # validation length; training draws from length_schedule
  filter_min_utterance_length: 2
  filter_min_utterance_per_speaker: 1

# The first sampled speaker is the near-field foreground; the rest are far-field
# interferers to suppress.
augmentation_speech:
  used: True
  is_target: False
  prob: 0.70
  add_n_cases:        # number of interferers (far speakers) per item
    - 1
    - 2
  snr_range:          # HARD SIR: foreground may be up to 10 dB QUIETER than the
    - -10             # interferer, so loudness alone cannot solve it and the
    - 10              # in-domain SI-SDRi metric stays sensitive (no passthrough rows).
  media_voice:        # TV/loudspeaker-style band-limited interferer: the most
    used: True        # common non-human interferer in a real near-field room.
    prob: 0.30
    hp_cutoff_range: [200, 400]
    lp_cutoff_range: [3500, 7000]
    compress_power_range: [0.6, 0.9]
  echo_playback:      # device self-playback echo as residual interferer (OFF)
    used: False
    prob: 0.20
    distance_range: [0.2, 1.0]
    erle_db_range: [20, 35]
  overlap_control:    # spread the foreground/interferer temporal overlap across
    used: True        # no/mid/high regimes (else >80% overlap dominates training)
    no_overlap_prob: 0.20
    high_overlap_prob: 0.35
    mid_overlap_range:
      - 0.10
      - 0.50
    high_overlap_range:
      - 0.50
      - 1.00
    fill_on_silent_range:
      - 0.50
      - 0.80
    fade_samples: 400
  mix_mode:           # foreground/interferer level relationship (N+F rows only).
    used: True        # NOTE: level is NOT a distance cue anywhere in this pipeline --
    modes:            # sources are RMS-normalized and RIRs peak-normalized per channel,
                      # so 'physical' = "no extra rescale" (a near-0 dB ratio); the cues
                      # that survive are DRR / tail shape / tilt.
      - {name: physical,      prob: 0.4, physical: True}
      # distance_level: the true level cue -- SIR from the inverse-distance
      # law on the scene's actual geometry (+jitter). A talker at 3 m really is
      # much quieter than one at 0.5 m; every other path here strips that.
      - {name: distance_level, prob: 0.2, distance_level: True, jitter_db: [-3, 3]}
      # moderate: mild rescale, keeps difficulty without routinely inverting levels.
      - {name: moderate,      prob: 0.25, sir_range: [-3, 6]}
      # counter_level: near deliberately quieter -> forces a non-energy cue
      # (kept so level never becomes a trusted-alone shortcut).
      - {name: counter_level, prob: 0.15, sir_range: [-10, 0]}

# OFF: synthetic target-absent silence injection. It teaches the model to emit
# SILENCE whenever it judges the foreground absent, which mis-fires on recordings
# outside the training domain and deletes true speech. Real-recording rows get
# their absolute-suppress examples from augmentation_realfar.lone_far_prob.
augmentation_target_absent:
  used: False
  prob: 0.20
  force_interferer: True

# Real far-field interferers: the far channel is a genuine loudspeaker->air->mic
# recording drawn from the pool manifest and inserted WITHOUT RIR convolution, so
# it carries the parts of a capture chain a convolution cannot reproduce
# (transducer non-linearity, directivity, noise floor, level and spectral tilt).
# The near foreground still uses the simulated near-field RIR above. On these rows
# the interferer count comes from augmentation_speech.add_n_cases and the level
# from its snr_range; 'physical' mix_mode is skipped, because the level ratio
# between a simulated near channel and a real far recording is not physical.
augmentation_realfar:
  used: True
  prob: 0.20
  lone_far_prob: 0.15   # of those rows, the share with NO near speaker: target is
                        # silence, the absolute "lone far voice = suppress" example.
                        # Deepens far suppression roughly linearly and pushes
                        # deletion up with it -- the main risk knob of this recipe.
  pool_manifest: data/realfar_pool/voices.train.jsonl
  stitch_to_length: True  # a 30 s row needs a pool entry that long
  turn_taking_prob: 0.3   # far-solo stretches inside otherwise normal N+F rows

# Real near-field KEEP rows. Foreground = a genuine <1 m recording (target =
# itself), interferers = draws from the far pool (same room preferred,
# speaker-disjoint), then the standard noise chain on top. This puts real captured
# speech on the KEEP side of the same kind of mixture whose far side is real: near
# and far then differ mainly in distance, so capture-chain identity is useless as
# a cue.
augmentation_realnear:
  used: True
  prob: 0.15
  turn_taking_prob: 0.5   # half of these rows become conversational turns: far-solo
                          # stretches with real near speech elsewhere in the clip,
                          # i.e. absolute contrast within one capture chain
  pool_manifest: data/realfar_pool/voices.near.train.jsonl
  stitch_to_length: True

# Session rows: one user, one or two bystanders, a script of who talks when, and
# the row's own floor in the gaps. See the header for the rates and
# puresound/task/session_rows.py for the contracts (one chain draw per row; a
# gap is floor, never digital silence; a long user gap is never target-absent).
# Disabled, or on a row shorter than min_seconds, this block draws nothing.
augmentation_session_rows:
  enabled: True
  prob: 0.5
  min_seconds: 12.0        # the 12 s and 30 s buckets; short buckets untouched
  max_seconds: 60.0        # no-op today -- the cap item 5 of the review asked for
  n_bystanders: [1, 2]
  user_distance_range: [0.3, 1.0]        # the bank's near pool
  bystander_distance_range: [1.5, 4.0]   # the bank's far pool
  shape_probs:
    user_first: 0.25       # U opens, then they alternate
    bystander_first: 0.30  # B holds the floor 2-8 s, U enters (wrong anchor)
    user_gap: 0.30         # U speaks, 5-20 s of floor, U returns (persistence)
    overlap: 0.15          # boundary double talk throughout (the KEEP guard)
  user_turn_seconds: [1.5, 4.0]
  bystander_turn_seconds: [2.0, 4.5]
  bystander_open_seconds: [2.0, 8.0]
  user_gap_seconds: [5.0, 20.0]
  turn_gap_seconds: [0.2, 0.8]
  overlap_seconds: [0.5, 3.0]
  boundary_overlap_prob: 0.25
  bystander_in_gap_prob: 0.7   # "the user stepped away" vs "nobody is near"
  min_turn_seconds: 0.5
  max_turns: 16
  rir_move_prob: 0.3                     # U changes seat, same room, same chain
  distance_matched_bystander_prob: 0.0   # labels use each rendered turn's RIR distance
  # SIR for the bystander bus. The tail is a separate regime draw so its share
  # is a knob: P(SIR <= -5 dB) = 0.30 here against 0.05 realised in v16.
  sir_range: [-5.0, 10.0]
  sir_low_tail_prob: 0.30
  sir_low_tail_range: [-10.0, -5.0]
  # The forced capture floor, mirroring augmentation_noise.absolute_floor's
  # semantics (level as drawn, upstream of the device chain). Low on purpose: it
  # is a guarantee against digital silence in a gap, not a second noise source.
  floor_dbfs_range: [-60.0, -45.0]
  fade_samples: 400
  pair_prob: 0.0                         # legacy source-pool twins are disabled
  pair_pool_size: 1024
  paired_view_prob: 0.50                 # second chain view, consistency only
  paired_view_min_seconds: 12.0

augmentation_noise:
  used: True
  prob: 0.8
  noise_folder: /data/audio/dns-5/datasets_fullband_16k/noise_fullband
  snr_range:
    - 0
    - 20
  prob_white_noise: 0.1
  white_noise_snr_range:
    - 10
    - 30
  # Noise shares the speech's room, so the floor is spatially coherent with the
  # mixture instead of arriving dry from nowhere. prob 0.5 keeps half the rows
  # dry -- some real noise (hum, electrical) genuinely has no room, and the
  # contrast preserves diversity.
  room_coloring:
    used: True
    prob: 0.5
  # A capture floor anchored to digital full scale, not to the mixture: a
  # deployed mic's self-noise and room tone sit at a fixed level whoever is
  # speaking. Mixture only; inherits the device chain like capsule noise.
  absolute_floor:
    used: True
    prob: 0.5
    level_dbfs_range: [-55, -35]

# Reverb from pre-generated RIR banks (source-level: foreground = near channel,
# interferers = far channels of the SAME room).
augmentation_reverb:
  used: True
  prob: 1.
  rir_folder:
  # target_rir_type "early": the target is the early-reflection (de-reverbed) near
  # speech. full-RIR targets let passthrough match the target (near is dominant),
  # so "early" forces reverb-tail removal and keeps separation a real objective.
  target_rir_type: "early"
  simulator:
    used: True
    source_level: True
    pregenerated:
      used: True
      # Four members served as one pool; every scene routes back to the member
      # that produced it. `weight` is a sampling probability, not an item share.
      # These are the weights the parent run's schedule ended on, held fixed.
      #
      # The first three are NESTED VIEWS of one generated pool, filtered by
      # difficulty -- core's rooms are also in expand, and expand's are also in
      # wide. Weighting them is therefore oversampling, not partitioning: an early
      # weight on `core` makes easy rooms frequent without making the rest
      # unreachable. `real` is the disjoint member: measured rooms whose near
      # channels are genuine <1 m impulse responses, which widen the keep-class
      # channel manifold beyond a single simulated near signature.
      banks:
        - name: core            # shortest RT60, widest near/far DRR separation
          weight: 0.06
          bank_type: room
          folder: /work/any_exp_link/puresound_exp/hybrid_rir_16k_levels/core
          near_labels: [near_0, near_1]
          far_labels: [far_0, far_1, far_2]
          drr_window_ms: 2.5
          cache_size: 64
        - name: expand          # moderate RT60, narrower DRR separation
          weight: 0.26
          bank_type: room
          folder: /work/any_exp_link/puresound_exp/hybrid_rir_16k_levels/expand
          near_labels: [near_0, near_1]
          far_labels: [far_0, far_1, far_2]
          drr_window_ms: 2.5
          cache_size: 64
        - name: wide            # every valid room the generator produced
          weight: 0.44
          bank_type: room
          folder: /work/any_exp_link/puresound_exp/hybrid_rir_16k_levels/wide
          near_labels: [near_0, near_1]
          far_labels: [far_0, far_1, far_2]
          drr_window_ms: 2.5
          cache_size: 64
        - name: real            # measured rooms, real <1 m near responses
          weight: 0.24
          bank_type: room
          folder: /work/any_exp_link/puresound_exp/real_rir_16k_train_view
          near_labels: [near_0, near_1]
          far_labels: [far_0, far_1, far_2]
          drr_window_ms: 2.5
          cache_size: 64

augmentation_speed:
  used: True
  prob: 0.5
  speed_range:
    - 0.95
    - 1.05

augmentation_ir_response:
  used: True
  prob: 0.3

augmentation_src:        # random down/up-sample (bandwidth variation). The 16000
  used: True             # entry is a no-op at target_sr 16k, so the effective
  prob: 0.5              # band-limiting rate is prob * P(8000) = 0.5 * 0.2 = 10%.
  src_range:
    - 8000
    - 16000
  prob_each:
    - 0.2
    - 0.8

# Real device mic front-ends commonly high-pass at 100-300 Hz.
augmentation_hpf:
  used: True
  prob: 0.25
  cutoff:
    - 100
    - 200
    - 300
  prob_each:
    - 0.4
    - 0.4
    - 0.2

augmentation_volume:
  used: True
  prob: 0.5
  perturbed_range:
    - 0.4
    - 1.6
  clipping_prob: 0.
  clipping_range:
    min:
      - 0.
      - 0.1
    max:
      - 0.9
      - 1.0

augmentation_codec:      # OFF (consumer-device realism; add incrementally if needed)
  used: False
  prob: 0.5
  codecs:
    - libopus
    - g722
  prob_each:
    - 0.7
    - 0.3
  bitrate_range:
    libopus:
      - 6000
      - 32000

augmentation_packet_loss:  # OFF (VoIP realism; add incrementally if needed)
  used: False
  prob: 0.3
  packet_ms_choices:
    - 20
    - 40
    - 60
  loss_rate_range:
    - 0.01
    - 0.10

# VAD is OFF (separation-only). Kept used:True with the cheap ENERGY backend ONLY
# so overlap_control has a gating labeler; no loss consumes these labels.
vad_label:
  used: True
  backend: energy
  args:
    frame_length: 400
    hop_length: 160

# The schedule. Every track names one knob and gives its value by epoch;
# `linear` interpolates between points and a track holds flat past its last
# point. The file's constants for these two knobs are their FINAL values.
curriculum:
  used: True
  tracks:
    # Session rows enter over the first cycle's descent. The block is enabled
    # with its probability at 0 from the first row -- the draw happens, only its
    # outcome changes -- so no other random draw in the row moves when it does.
    - path: "aug:augmentation_session_rows.prob"
      interp: linear
      points: [[0, 0.0], [8, 0.5]]
    # The ordering loss reads turn distances that only session rows carry, so it
    # waits until there are rows to read and then follows them in.
    - path: "loss:RelativeProximityLoss"
      interp: linear
      points: [[4, 0.0], [12, 0.1]]

trainer:
  lightning_trainer_args:
    # Two cosine cycles. Stops on a trough by itself so a benchmark can be
    # chained after the training command.
    max_epochs: 40
    gradient_clip_val: 5.
    accumulate_grad_batches: 2
    precision: bf16-mixed
  train_iter_per_epoch: 1000
  valid_iter_per_epoch: 100
  valid_seed: 1234
  n_spk_per_batch: 12          # validation batch; training uses the schedule
  # Mixed row lengths, drawn per batch. A row is scored as a whole, so training at
  # one length only supervises the opening frames at 1/N of the loss; the batch
  # size travels with the length so activation memory stays flat. Validation keeps
  # n_spk_per_batch / training_length_seconds, so its loss stays comparable.
  length_schedule:
    - {seconds: 3.,  n_spk: 20, prob: 0.25}
    - {seconds: 6.,  n_spk: 12, prob: 0.30}
    - {seconds: 12., n_spk: 6,  prob: 0.25}
    - {seconds: 30., n_spk: 2,  prob: 0.20}
  n_utt_per_speaker: 1
  num_workers: 20
  num_gpus: 2
  find_unused_parameters: true
  work_folder: exp/dpcrn_curriculum_v1

optimizer:
  type: AdamW
  learning_rate: 0.001
  args:
    weight_decay: 0.00001
    betas:
     - 0.9
     - 0.999

scheduler:
  # Warm restarts every T_0 epochs; compare runs only at the cosine troughs
  # (~ep19, ~ep39, ...) -- mid-cycle epochs are LR-perturbed and not comparable.
  type: CosineAnnealingWarmRestarts
  warmup_step: 250
  args:
    T_0: 20
    T_mult: 1
    eta_min: 0.00001

loss_func:
  - type: SDRLoss
    weighted: 1.
    args:
      scaled: False
      scale_dependent: True
      zero_mean: True
      source_aggregated: False
      sdr_max: 50
      threshold: -50

  - type: MultiResolutionSTFTLoss
    weighted: 0.5
    args:
      fft_sizes:
        - 512
        - 1024
        - 256
      hop_sizes:
        - 128
        - 256
        - 64
      win_lengths:
        - 512
        - 1024
        - 256
      window: hann_window
      factor_sc: 0.5
      factor_mag: 0.5

  # ANTI-SUPPRESSION: pure-magnitude one-sided loss = mean(ReLU(|T|^p - |E|^p)^2).
  # Penalises enhanced magnitude falling BELOW target (deletion); over-estimation
  # is already covered by SD-SDR + STFT above, so this adds net asymmetric
  # pressure toward preservation. Its weight is scheduled (see `curriculum`);
  # the value here is the epoch-0 one.
  - type: OverSuppressionLoss
    weighted: 3.0
    args:
      p: 0.5
      fft_size: 512
      hop_size: 128
      win_length: 512

  # Training-only background accounting: residual = noisy - enhanced is supervised
  # against consistency_noise (= noisy - clean). Deployment stays single-output.
  - type: ResidualReferenceLoss
    weighted: 0.2
    args:
      reference_key: consistency_noise
      loss: l1
      target_present_only: True

  # ASR-aware perceptual loss: match enhanced features to the clean target's
  # features inside frozen 16 kHz SSL encoders, which penalises destroyed
  # intelligibility that signal losses alone do not see. Two encoders are stacked
  # because they fail differently: HuBERT carries general phonetic content, while
  # WavLM is pretrained with denoising and simulated overlapped speech and so
  # reacts to the noise/overlap conditions where deletion appears.
  # NOTE: both terms use `loss: cosine` on purpose. Cosine is scale-invariant, so
  # the two encoders' different feature magnitudes do not fight and equal weights
  # really mean equal influence. `crop_seconds` holds the SSL supervision constant
  # across length buckets, so row length is the only thing the schedule varies.
  - type: ASRFeatureLoss          # general phonetic content
    weighted: 1.0
    args:
      bundle: HUBERT_BASE
      layers: [6, 9]
      loss: cosine
      crop_seconds: 6.

  - type: ASRFeatureLoss          # noise/overlap-robust SSL features
    weighted: 1.0
    args:
      bundle: WAVLM_BASE_PLUS
      layers: [6, 9]
      loss: cosine
      crop_seconds: 6.

  # Pairs with backbone.dist_head: push the bottleneck to encode physical
  # proximity (DRR / log-distance) rather than the capture-chain signature.
  # NaN-masked, so simulated rows supervise all three targets and real rows only
  # their distances. Scheduled: the value here is the epoch-0 one.
  - type: DistHeadRegressionLoss
    weighted: 0.3
    args:
      drr_scale: 10.0
      min_dist: 0.1
      max_dist: 30.0

  # Session labels are optional on ordinary rows, so the losses return graph
  # zeros there. The ordering term reads actual `turn_distance` values; the
  # paired-view dispatcher below calls its explicit consistency method once per
  # nested view and never repeats separation supervision.

  - type: RelativeProximityLoss
    weighted: 0.1
    args:
      margin: 1.0
      consistency_weight: 1.0
      min_turn_frames: 1
      min_distance_gap_m: 0.25
      scale_free: False
      temperature: 1.0
      pair_selection: cross_role

  # Frame-level presence supervision. This consumes vad_target; target_present
  # remains a row-level diagnostic and is intentionally not broadcast over time.
  - type: VADHeadBCELoss
    weighted: 0.1
    args:
      false_positive_weight: 1.0
      false_negative_weight: 1.0
      balance_per_batch: False
  # ------------------------------------------------------------------ #

model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
      # Whole-mix EQ/gain perturbation with a mask-consistency penalty: changing
      # the recording chain must not change the keep/suppress decision.
      channel_consistency:
        enabled: True
        prob: 0.3
        weight: 1.0
        eq_db: 6.0
        gain_db: 4.0
        max_rows: 4       # sub-batch for the second forward (a full batch doubles
                          # peak activation memory; a regularizer does not need it)
      # A second capture-chain view of a session row, nested in the batch and
      # read only by losses that declare a consistency method.
      paired_view_consistency:
        enabled: True
        max_rows: 1
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256
    # bins. backbone_args adapted from egs/noise_suppression/config/dpcrn.yaml.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 32, 64, 128]   # widened encoder/decoder stack (~1M params total)
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30 ms) look-ahead; inter-RNN stays unidirectional
      rnn_hidden: 96
      spectral_compress: False
      # Utterance-level distance/DRR regression head off the bottleneck.
      # Training-only: inference and the streaming export never read it. Labels
      # are the scalars the dataset already emits, NaN-masked in the loss.
      dist_head:
        enabled: True
        hidden: 128
      # Training-only side heads. The inference and streaming paths do not read
      # these outputs, so the separator output contract remains unchanged.
      identity_head:
        enabled: False     # CYCLE 1: OFF (design §10/§11 -- identity is supplied by the
        dim: 64            #   frozen SV model or a distilled head in a later round, not
        kernel_t: 5        #   learned from the bottleneck; P0 measured it is not there)
      proximity_head:
        enabled: True
        hidden: 64         # kernel_t is the identity head's, deliberately not a knob
      vad_head:
        enabled: True
        hidden: 64
        kernel_t: 5
        ema_taus_s: null
        frame_rate: 100.0
      # No graph-carrying bottleneck is needed by this baseline; keep the
      # inference probe detached and off during training.
      expose_bottleneck: False
