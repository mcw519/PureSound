# voice_isolate -- EXPERIMENT: widen the v8 bank with the M6.4 release (union).
#
# Question: the v8 recipe unchanged, but its RIR pool EXPANDED with M6's
# calibrated synthetic rooms instead of replaced by them. Does more room
# diversity buy anything, now that replacement has been ruled out?
#
# What the replacement round already settled (exp/dpcrn_m6bank_v8recipe, ep19,
# v8 weights + M6 synthetic_calibrated ALONE): a net loss. VOiCES >1m paired
# median -15.91 -> -10.69, and the damage is a heavy tail rather than a uniform
# shift -- 20/71 files lost more than 3 dB, 7/71 more than 10 dB, all of it
# between 1.7 m and 4.5 m. The 2-3 m band that the realism knobs had filled
# (-16.61) fell back to -4.66, i.e. to roughly where v7 sat before the fill.
# 5m+ (-19.85) and near-field keep (+0.01) were untouched. Cross-chain RealMAN
# was a wash (-7.21 -> -6.59) and the QVF clips did not move.
#
# Two confounds made that verdict useless as a judgement of M6's acoustics, and
# a union removes both:
#   * SIZE: M6's train split is 39,560 items against the hybrid bank's 122,792
#     -- 3.1x fewer rooms. Mid distances are the ones that need room variety.
#     (items/ holds 245,584 files because every item is a wav + json pair;
#     merged.json is the authority: 95,344 simulated + 27,448 measured.)
#   * MEASURED ROOMS: 27,448 of the hybrid bank's items (22.4%) are measured
#     RIRs whose near channels are real <1 m impulse responses. M6's
#     synthetic_calibrated recipe is synthetic-only, so replacing the bank also
#     deleted every measured room. (M6's mixed_calibrated_real recipe, which
#     would carry them, is still status=blocked.)
# Under the union the hybrid pool stays exactly what it was, measured rooms
# included, and M6 rides alongside it at a fixed sampling weight.
#
# WEIGHT: 0.70 hybrid / 0.30 M6. Weights are sampling probabilities, not item
# shares, so M6's 39.5k rooms get 30% of the draws (~72k over a 20-epoch cycle,
# every room seen) while hybrid still gets ~168k draws across its 123k rooms.
# 0.30 is high enough for M6 to be visible in the gradient and low enough that
# the rooms behind v8's mid-distance depth remain the majority. If this reads
# neutral, the follow-up is a heavier mix (0.5) rather than a different recipe.
#
# Warm-start from v8, so any difference is the bank and nothing else:
#   uv run python egs/voice_isolate/main.py \
#       egs/voice_isolate/config/exp/train_dpcrn_m6bank_union.yaml --training \
#       --pretrained_ckpt_path egs/voice_isolate/pretrained_ckpt/dpcrn_v8.ckpt
#
# JUDGE AT ep19 (cosine trough; mid-cycle numbers have no judging value). The
# bar is v8 itself, paired file by file:
#   * VOiCES >1m paired median  -15.91  (leakage-free subset -17.74)
#     and the 1.7-4.5 m tail: no more than a couple of files worse by >3 dB
#   * 2-3m band -16.61, 3-5m -17.89, 5m+ -19.97
#   * RealMAN cross-chain >1m -7.21, keep -0.72
#   * QVF clips -0.72 / -1.29 / -0.92
#   * Dawn deletion 0.094, BUT-OFFICE -0.024, turn-taking KEEP 6, in-domain +7.99
# A pass means holding all of that and improving something; holding it while
# improving nothing means M6's rooms add no information this task can use.
#
# Recipe schema v2: `task` selects the model that validates this file
# (puresound/config/recipe.py); `purpose` picks training vs model-only.
schema_version: 2
purpose: train
task: voice_isolation

dataset:
  train_metafile: data/dns5-read.train.list
  valid_metafile: data/dns5-read.dev.list
  test_folder: data/test
  proc_output_folder: proc
  target_sample_rate: 16000
  gain_normalized_to: -28
  training_length_seconds: 6.
  filter_min_utterance_length: 2 # 4.
  filter_min_utterance_per_speaker: 1
  # Keep validation on the same room distribution as training for this run.
  validation_pipeline_role: train

# The first sampled speaker is the near-field foreground; the rest are far-field
# interferers to suppress.
augmentation_speech:
  used: True
  is_target: False
  prob: 0.70
  add_n_cases:        # number of interferers (far speakers) per item
    - 1
    - 2
  snr_range:          # HARD SIR: foreground may be up to 10 dB QUIETER than the
    - -10             # interferer, so loudness alone cannot solve it and the
    - 10              # in-domain SI-SDRi metric stays sensitive (no passthrough rows).
  media_voice:        # TV/loudspeaker-style band-limited interferer -- ON for the deployment
    used: True        # recipe: the most common non-human interferer in real near-field rooms.
    prob: 0.30
    hp_cutoff_range: [200, 400]
    lp_cutoff_range: [3500, 7000]
    compress_power_range: [0.6, 0.9]
  echo_playback:      # device self-playback echo as residual interferer (OFF for now)
    used: False
    prob: 0.20
    distance_range: [0.2, 1.0]
    erle_db_range: [20, 35]
  overlap_control:    # spread the foreground/interferer temporal overlap across
    used: True        # no/mid/high regimes (else >80% overlap dominates training)
    no_overlap_prob: 0.20
    high_overlap_prob: 0.35
    mid_overlap_range:
      - 0.10
      - 0.50
    high_overlap_range:
      - 0.50
      - 1.00
    fill_on_silent_range:
      - 0.50
      - 0.80
    fade_samples: 400
  mix_mode:           # foreground/interferer level relationship (N+F rows only).
    used: True        # NOTE: level is NOT a distance cue anywhere in this pipeline --
    modes:            # sources are RMS-normalized and RIRs peak-normalized per channel,
                      # so 'physical' = "no extra rescale" (a near-0 dB ratio); the cues
                      # that survive are DRR / tail shape / tilt.
      - {name: physical,      prob: 0.4, physical: True}
      # distance_level: the true level cue -- SIR from the inverse-distance
      # law on the scene's actual geometry (+jitter). A talker at 3 m really is
      # ~15 dB quieter than one at 0.5 m; every other path here strips that.
      - {name: distance_level, prob: 0.2, distance_level: True, jitter_db: [-3, 3]}
      # moderate: mild rescale, keeps difficulty without routinely inverting levels.
      - {name: moderate,      prob: 0.25, sir_range: [-3, 6]}
      # counter_level: near deliberately quieter -> forces a non-energy cue
      # (kept so level never becomes a trusted-alone shortcut).
      - {name: counter_level, prob: 0.15, sir_range: [-10, 0]}

# OFF: synthetic target-absent silence injection. It teaches the model to emit
# SILENCE whenever it judges the foreground absent, which mis-fires on recordings
# outside the training domain and deletes true speech. Enable (small prob) only if
# leakage -- interferer passed through while nobody is near -- becomes the actual
# problem. Real-recording rows get their absolute-suppress examples from
# augmentation_realfar.lone_far_prob instead.
augmentation_target_absent:
  used: False
  prob: 0.20
  force_interferer: True

# Real far-field interferers: the far channel is a genuine loudspeaker->air->mic
# recording drawn from the pool manifest and inserted WITHOUT RIR convolution, so it
# carries the parts of a capture chain a convolution cannot reproduce (transducer
# non-linearity, directivity, noise floor, level and spectral tilt). The near
# foreground still uses the simulated near-field RIR above. On these rows the
# interferer count comes from augmentation_speech.add_n_cases and the level from its
# snr_range (hard SIR); 'physical' mix_mode is skipped, because the level ratio
# between a simulated near channel and a real far recording is not physical.
augmentation_realfar:
  used: True
  prob: 0.20            # share of items whose interferers are real recordings
  lone_far_prob: 0.15   # of those, the share with NO near speaker: target is silence,
                        # the absolute "lone far voice = suppress" example. Raising it
                        # deepens far suppression roughly linearly but also pushes
                        # deletion up, so it is the main risk knob of this recipe.
  # Far pool: real distant single-speaker recordings, one JSON object per line, built
  # by scripts/build_real_recording_pool.py (the released model used ~150k VOiCES recordings,
  # 200 speakers, 4 rooms, 1.5-10.3 m, no competing distractor).
  pool_manifest: data/realfar_pool/voices.train.jsonl
  turn_taking_prob: 0.3   # far-solo stretches inside otherwise normal N+F rows

# Real near-field KEEP rows. Foreground = a genuine <1 m recording (target = itself),
# interferers = draws from the far pool (same room preferred, speaker-disjoint), then
# the standard noise chain on top. This puts real captured speech on the KEEP side of
# the same kind of mixture whose far side is real: near and far then differ mainly in
# distance, so capture-chain identity is useless as a cue.
augmentation_realnear:
  used: True
  prob: 0.15
  turn_taking_prob: 0.5   # half of these rows become conversational turns: multi-second
                          # far-solo stretches with real near speech elsewhere in the
                          # clip, i.e. absolute contrast within one capture chain
  pool_manifest: data/realfar_pool/voices.near.train.jsonl

augmentation_noise:
  used: True
  prob: 0.8
  noise_folder: /data/audio/dns-5/datasets_fullband_16k/noise_fullband
  snr_range:
    - 0
    - 20
  prob_white_noise: 0.1
  white_noise_snr_range:
    - 10
    - 30
  # Noise shares the speech's room, so the floor is spatially coherent with the
  # mixture instead of arriving dry from nowhere. prob 0.5 keeps half the rows
  # dry -- some real noise (hum, electrical) genuinely has no room, and the
  # contrast preserves diversity.
  room_coloring:
    used: True
    prob: 0.5
  # A capture floor anchored to digital full scale, not to the mixture: a
  # deployed mic's self-noise and room tone sit at a fixed level whoever is
  # speaking. -55..-35 dBFS against -28 dBFS speech spans the -8..-21 dB
  # speech-to-floor range measured on real recordings, plus a cleaner margin.
  # Mixture only; inherits the device chain like capsule noise.
  absolute_floor:
    used: True
    prob: 0.5
    level_dbfs_range: [-55, -35]

# Reverb from the pre-generated RIR bank (source-level: foreground = near channel,
# interferers = far channels of the SAME room).
augmentation_reverb:
  used: True
  prob: 1.
  rir_folder:
  # target_rir_type "early": the target is the early-reflection (de-reverbed) near
  # speech. full-RIR targets let passthrough match the target (near is dominant),
  # so "early" forces reverb-tail removal and keeps separation a real objective.
  target_rir_type: "early"
  simulator:
    used: True
    source_level: True
    pregenerated:
      used: True
      # ROUND KNOB: two banks served as one pool. Each keeps its own layout,
      # labels and wav cache, and every scene is routed back to the bank that
      # produced it, so the members cannot answer for each other. `weight` is a
      # sampling probability, not an item share.
      banks:
        # Member 1 -- exactly the v8 pool, untouched. Simulated rooms plus
        # measured-RIR rooms (~22% here) whose near channels are all real <1 m
        # impulse responses; those widen the keep-class channel manifold beyond
        # a single simulated near signature.
        - name: hybrid
          weight: 0.7
          bank_type: room
          folder: /work/any_exp_link/puresound_exp/hybrid_rir_16k_realfar
          near_labels: [near_0, near_1]
          far_labels: [far_0, far_1, far_2]
          drr_window_ms: 2.5
          cache_size: 128
        # Member 2 -- the M6.4 release, synthetic-only (39,560 train items).
        # `audit: False` because a cold audit of this release reads all 68 GB
        # (23.8 min, measured valid=True on 2026-08-07) and each DDP rank would
        # repeat it inside the 30-minute rendezvous timeout; see
        # train_dpcrn_m6bank_scratch.yaml for the full startup-cost note.
        - name: m6_synthetic_calibrated
          weight: 0.3
          bank_type: release
          folder: /work/any_exp_link/puresound_exp/hybrid_rir_16k_m6_20260804/path-events-m4_release
          recipe_id: synthetic_calibrated
          split: train
          require_production: False
          audit: False
          near_labels: [near_0, near_1]
          far_labels: [far_0, far_1, far_2]
          drr_window_ms: 2.5
          cache_size: 128

augmentation_speed:
  used: True
  prob: 0.5
  speed_range:
    - 0.95
    - 1.05

augmentation_ir_response:
  used: True
  prob: 0.3

augmentation_src:        # random down/up-sample (bandwidth variation). The 16000
  used: True             # entry is a no-op at target_sr 16k, so the effective
  prob: 0.5              # band-limiting rate is prob * P(8000) = 0.5 * 0.2 = 10%.
  src_range:
    - 8000
    - 16000
  prob_each:
    - 0.2
    - 0.8

# ON for the deployment recipe: real device mic front-ends commonly high-pass at 100-300 Hz.
augmentation_hpf:
  used: True
  prob: 0.25
  cutoff:
    - 100
    - 200
    - 300
  prob_each:
    - 0.4
    - 0.4
    - 0.2

augmentation_volume:
  used: True
  prob: 0.5
  perturbed_range:
    - 0.4
    - 1.6
  clipping_prob: 0.
  clipping_range:
    min:
      - 0.
      - 0.1
    max:
      - 0.9
      - 1.0

augmentation_codec:      # OFF (consumer-device realism; add incrementally if needed)
  used: False
  prob: 0.5
  codecs:
    - libopus
    - g722
  prob_each:
    - 0.7
    - 0.3
  bitrate_range:
    libopus:
      - 6000
      - 32000

augmentation_packet_loss:  # OFF (VoIP realism; add incrementally if needed)
  used: False
  prob: 0.3
  packet_ms_choices:
    - 20
    - 40
    - 60
  loss_rate_range:
    - 0.01
    - 0.10

# VAD is OFF (separation-only). Kept used:True with the cheap ENERGY backend ONLY
# so overlap_control has a gating labeler; no loss consumes these labels.
vad_label:
  used: True
  backend: energy
  args:
    frame_length: 400
    hop_length: 160

trainer:
  lightning_trainer_args:
    max_epochs: 100
    gradient_clip_val: 5.
    accumulate_grad_batches: 2
    precision: bf16-mixed
  train_iter_per_epoch: 1000
  valid_iter_per_epoch: 100
  valid_seed: 1234
  n_spk_per_batch: 12
  n_utt_per_speaker: 1
  num_workers: 20
  num_gpus: 2
  find_unused_parameters: true
  work_folder: exp/dpcrn_m6bank_union

optimizer:
  type: AdamW
  learning_rate: 0.001
  args:
    weight_decay: 0.00001
    betas:
     - 0.9
     - 0.999

scheduler:
  # Warm restarts every T_0 epochs; compare runs only at the cosine troughs
  # (~ep19, ~ep39, ...) -- mid-cycle epochs are LR-perturbed and not comparable.
  type: CosineAnnealingWarmRestarts
  warmup_step: 250
  args:
    T_0: 20
    T_mult: 1
    eta_min: 0.00001

loss_func:
  - type: SDRLoss
    weighted: 1.
    args:
      scaled: False
      scale_dependent: True
      zero_mean: True
      source_aggregated: False
      sdr_max: 50
      threshold: -50

  - type: MultiResolutionSTFTLoss
    weighted: 0.5
    args:
      fft_sizes:
        - 512
        - 1024
        - 256
      hop_sizes:
        - 128
        - 256
        - 64
      win_lengths:
        - 512
        - 1024
        - 256
      window: hann_window
      factor_sc: 0.5
      factor_mag: 0.5

  # ANTI-SUPPRESSION: pure-magnitude one-sided loss = mean(ReLU(|T|^p - |E|^p)^2).
  # Penalises enhanced magnitude falling BELOW target (deletion); over-estimation is
  # already covered by SD-SDR + STFT above, so this adds net asymmetric pressure toward
  # preservation. `weighted` trades deletions against substitutions. Judge its effect
  # with a strong ASR: weak recognizers hide over-suppression.
  - type: OverSuppressionLoss
    weighted: 3.0
    args:
      p: 0.5
      fft_size: 512
      hop_size: 128
      win_length: 512

  # Training-only background accounting: residual = noisy - enhanced is supervised
  # against consistency_noise (= noisy - clean). Deployment stays single-output.
  - type: ResidualReferenceLoss
    weighted: 0.2
    args:
      reference_key: consistency_noise
      loss: l1
      target_present_only: True

  # ASR-aware perceptual loss: match enhanced features to the clean target's features
  # inside frozen 16 kHz SSL encoders, which penalises destroyed intelligibility that
  # signal losses alone do not see. Two encoders are stacked because they fail
  # differently: HuBERT carries general phonetic content, while WavLM is pretrained
  # with denoising and simulated overlapped speech and so reacts to the noise/overlap
  # conditions where deletion appears.
  # NOTE: both terms use `loss: cosine` on purpose. Cosine is scale-invariant, so the
  # two encoders' different feature magnitudes do not fight and equal weights really
  # mean equal influence; with `loss: l1` the weights would need rebalancing.
  - type: ASRFeatureLoss          # general phonetic content
    weighted: 1.0
    args:
      bundle: HUBERT_BASE
      layers: [6, 9]
      loss: cosine

  - type: ASRFeatureLoss          # noise/overlap-robust SSL features
    weighted: 1.0
    args:
      bundle: WAVLM_BASE_PLUS
      layers: [6, 9]
      loss: cosine

  # Pairs with backbone.dist_head: push the bottleneck to encode physical proximity
  # (DRR / log-distance) rather than the capture-chain signature. NaN-masked, so
  # simulated rows supervise all three targets and real rows only their distances.
  - type: DistHeadRegressionLoss
    weighted: 0.3
    args:
      drr_scale: 10.0
      min_dist: 0.1
      max_dist: 30.0

model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
      # Whole-mix EQ/gain perturbation with a mask-consistency penalty: changing the
      # recording chain must not change the keep/suppress decision.
      channel_consistency:
        enabled: True
        prob: 0.3
        weight: 1.0
        eq_db: 6.0
        gain_db: 4.0
        max_rows: 4       # sub-batch for the second forward (a full batch doubles
                        # peak activation memory; a regularizer does not need it)
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256
    # bins. backbone_args adapted from egs/noise_suppression/config/dpcrn.yaml.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 32, 64, 128]   # widened encoder/decoder stack (~1M params total)
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30 ms) look-ahead; inter-RNN stays unidirectional
      rnn_hidden: 96
      spectral_compress: False
      # Utterance-level distance/DRR regression head off the bottleneck. Training-only:
      # inference and the streaming export never read it. Labels are the scalars the
      # dataset already emits, NaN-masked in DistHeadRegressionLoss.
      dist_head:
        enabled: True
        hidden: 128
