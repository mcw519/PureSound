# voice_isolate -- EXPERIMENT v20 R1a (data side): session rows.
#
# v16 VERBATIM plus ONE new block, `augmentation_session_rows`, and the two
# monitoring/bookkeeping lines named at the bottom of this header. Nothing else
# differs -- same corpus, same length schedule, same losses, same model. The
# round's pre-registration is
# `benchmarks/probes/v20_self_enrolling_foreground_design.md` (§4.1 is this
# file's mandate); what the block does and what it refuses to do is
# `puresound/task/session_rows.py`; the measured before/after distribution is
# `benchmarks/probes/v20_session_rows/README.md`.
#
# WHY A NEW ROW TYPE AT ALL. The training distribution is what makes the current
# foreground decision cheap. Measured on 1206 rows of v16
# (`benchmarks/probes/v19c_diagnostics/training_data_audit/tables.md`): the
# target's onset is inside 0.5 s on 90.7% of rows; an interferer holds the floor
# for >=1 s before it on 6.0%; the longest target-free gap is 0.53 s at the
# median and >=5 s on 0.3%; re-entry after >=5 s on 0.3%; NO row renders the same
# talker twice; realised SIR is +0.5 dB at the median with p5 -8.1. A model has
# no reason to learn "who the user is" from that -- "whoever is already talking"
# is a cheaper answer, and it is the answer the record says it learned.
#
# THE KNOBS, and the numbers they were set to:
#   min_seconds 12.0   sessions live on the 12 s and 30 s buckets only. That is
#                      45% of batches and 1900 of the 10500 rows per 1000
#                      iterations. Eligibility is tested BEFORE the row-type
#                      draw, so the 3 s and 6 s buckets are bit-identical to
#                      v16's -- the short-context behaviour this recipe must not
#                      lose is trained on exactly the rows that trained it.
#   prob 0.5           half of those become sessions: ~950 rows / 1000 iters =
#                      9.0% of rows. The other half stay real-far / real-near /
#                      synthetic, which is deliberate: the real-recording rows
#                      are the only real material in the recipe and round-1's
#                      deletion explosion was fixed by adding them.
#   shape_probs        all four shapes non-trivial (0.25 / 0.30 / 0.30 / 0.15).
#                      bystander_first is the wrong-anchor shape, user_gap is
#                      the persistence shape, overlap is the KEEP guard.
#   sir_low_tail 0.30  a loud bystander in 30% of session rows, against 5% in
#                      v16's realised SIR -- global deletion under a loud
#                      bystander is g ~ -5 dB at -5 dB SIR. Floored at the
#                      recipe's own snr_range bottom (-10 dB); this block widens
#                      a tail, it never invents a level the recipe forbids.
#   rir_move 0.3       the user changes seat mid-session: a second near channel
#                      of the SAME room. An RIR change and nothing else -- ONE
#                      device-chain draw per row, jointly on mixture and target,
#                      exactly as every other row type (review item 6).
#   matched 0.2        one bystander in the user's own distance class, so
#                      "near" cannot answer both the identity and the proximity
#                      objective at once (review item 4).
#   pair 0.25 / 256    a quarter of session rows render the material their
#                      `row_source_id` determines, through their own chain draw:
#                      the cross-chain pairs the proximity consistency term
#                      reads. 256 distinct paired sources; see the README for
#                      the measured within-batch pair rate and its caveat.
#   max_seconds 60.0   a no-op at the 30 s bucket, and the knob item 5 of the
#                      review asked for. State-carrying truncated segments do
#                      not exist in this trainer, so an R1a session IS a long
#                      row inside the existing schedule -- which is why
#                      trainer.length_schedule is untouched (v15's
#                      budget-shortfall confound) and rows/batch stays 10.5.
#
# R1a'S OTHER HALF IS ENABLED HERE. `identity_head` + `proximity_head` +
# `expose_bottleneck` under backbone_args, and `IdentityContrastiveLoss` +
# `RelativeProximityLoss` at 0.1 each under loss_func. Both heads are
# per-frame and training-only (the v11 pattern: the inference and streaming
# paths never read them), and both losses are graph-carrying zeros on a batch
# with no session row -- so the 3 s / 6 s buckets are v16 exactly, objective
# included. The heads add weights the warm-start checkpoint does not have, so
# `scripts/preflight_ckpt_recipe.py` reports MISSING 14 against v16 ep19 --
# backbone.identity_head.* (6) and backbone.proximity_head.* (8), listed key by
# key in benchmarks/probes/v20_session_rows/README.md §11 -- and 0 dropped
# trained backbone weights. That is the expected result of adding a head, not a
# failure of this file: `main.py --pretrained_ckpt_path` loads non-strictly, so
# those 14 initialise from the head constructors, which is the intent.
#
# TO RUN THE DATA AXIS ALONE, comment out the two loss_func entries AND the
# three backbone_args lines together (a loss without its head raises at the
# first step, by design) -- that variant reports 0 missing / 0 unexpected.
#
# ALSO CHANGED, and only these: `work_folder`, `max_epochs`/`T_0` back to one
# 20-epoch cosine cycle (v16's 40 takes a second cycle and ep19 is the
# comparable trough), and `module_args.verbose: True` so the per-term loss
# curves the round reads are actually emitted.
#
# WARM START v16 ep19 -- never from scratch: the eight-stage ladder is
# load-bearing (its last stage alone reaches -1.65 dB real far suppression
# against v8's -9.83).
#
#   cd egs/voice_isolate
#   uv run python main.py config/exp/train_dpcrn_v20_r1a.yaml --training \
#       --pretrained_ckpt_path /work/any_exp_link/puresound_exp/\
# dpcrn_v16_lengthmix/lightning_logs/version_0/checkpoints/epoch=19-step=10000.ckpt
#
# training_length_seconds below is the VALIDATION length (and the fallback when no
# schedule is set); valid loss is comparable within this round only.
schema_version: 2
purpose: train
task: voice_isolation

dataset:
  train_metafile: data/dns5-read.chapters.train.list
  valid_metafile: data/dns5-read.chapters.dev.list
  test_folder: data/test
  proc_output_folder: proc
  target_sample_rate: 16000
  gain_normalized_to: -28
  training_length_seconds: 6.   # validation length; training draws from length_schedule
  filter_min_utterance_length: 2 # 4.
  filter_min_utterance_per_speaker: 1

# The first sampled speaker is the near-field foreground; the rest are far-field
# interferers to suppress.
augmentation_speech:
  used: True
  is_target: False
  prob: 0.70
  add_n_cases:        # number of interferers (far speakers) per item
    - 1
    - 2
  snr_range:          # HARD SIR: foreground may be up to 10 dB QUIETER than the
    - -10             # interferer, so loudness alone cannot solve it and the
    - 10              # in-domain SI-SDRi metric stays sensitive (no passthrough rows).
  media_voice:        # TV/loudspeaker-style band-limited interferer -- ON for the deployment
    used: True        # recipe: the most common non-human interferer in real near-field rooms.
    prob: 0.30
    hp_cutoff_range: [200, 400]
    lp_cutoff_range: [3500, 7000]
    compress_power_range: [0.6, 0.9]
  echo_playback:      # device self-playback echo as residual interferer (OFF for now)
    used: False
    prob: 0.20
    distance_range: [0.2, 1.0]
    erle_db_range: [20, 35]
  overlap_control:    # spread the foreground/interferer temporal overlap across
    used: True        # no/mid/high regimes (else >80% overlap dominates training)
    no_overlap_prob: 0.20
    high_overlap_prob: 0.35
    mid_overlap_range:
      - 0.10
      - 0.50
    high_overlap_range:
      - 0.50
      - 1.00
    fill_on_silent_range:
      - 0.50
      - 0.80
    fade_samples: 400
  mix_mode:           # foreground/interferer level relationship (N+F rows only).
    used: True        # NOTE: level is NOT a distance cue anywhere in this pipeline --
    modes:            # sources are RMS-normalized and RIRs peak-normalized per channel,
                      # so 'physical' = "no extra rescale" (a near-0 dB ratio); the cues
                      # that survive are DRR / tail shape / tilt.
      - {name: physical,      prob: 0.4, physical: True}
      # distance_level: the true level cue -- SIR from the inverse-distance
      # law on the scene's actual geometry (+jitter). A talker at 3 m really is
      # ~15 dB quieter than one at 0.5 m; every other path here strips that.
      - {name: distance_level, prob: 0.2, distance_level: True, jitter_db: [-3, 3]}
      # moderate: mild rescale, keeps difficulty without routinely inverting levels.
      - {name: moderate,      prob: 0.25, sir_range: [-3, 6]}
      # counter_level: near deliberately quieter -> forces a non-energy cue
      # (kept so level never becomes a trusted-alone shortcut).
      - {name: counter_level, prob: 0.15, sir_range: [-10, 0]}

# OFF: synthetic target-absent silence injection. It teaches the model to emit
# SILENCE whenever it judges the foreground absent, which mis-fires on recordings
# outside the training domain and deletes true speech. Enable (small prob) only if
# leakage -- interferer passed through while nobody is near -- becomes the actual
# problem. Real-recording rows get their absolute-suppress examples from
# augmentation_realfar.lone_far_prob instead.
augmentation_target_absent:
  used: False
  prob: 0.20
  force_interferer: True

# Real far-field interferers: the far channel is a genuine loudspeaker->air->mic
# recording drawn from the pool manifest and inserted WITHOUT RIR convolution, so it
# carries the parts of a capture chain a convolution cannot reproduce (transducer
# non-linearity, directivity, noise floor, level and spectral tilt). The near
# foreground still uses the simulated near-field RIR above. On these rows the
# interferer count comes from augmentation_speech.add_n_cases and the level from its
# snr_range (hard SIR); 'physical' mix_mode is skipped, because the level ratio
# between a simulated near channel and a real far recording is not physical.
augmentation_realfar:
  used: True
  prob: 0.20            # share of items whose interferers are real recordings
  lone_far_prob: 0.15   # of those, the share with NO near speaker: target is silence,
                        # the absolute "lone far voice = suppress" example. Raising it
                        # deepens far suppression roughly linearly but also pushes
                        # deletion up, so it is the main risk knob of this recipe.
  # Far pool: real distant single-speaker recordings, one JSON object per line, built
  # by scripts/build_real_recording_pool.py (the released model used ~150k VOiCES recordings,
  # 200 speakers, 4 rooms, 1.5-10.3 m, no competing distractor).
  pool_manifest: data/realfar_pool/voices.train.jsonl
  stitch_to_length: True
  turn_taking_prob: 0.3   # far-solo stretches inside otherwise normal N+F rows

# Real near-field KEEP rows. Foreground = a genuine <1 m recording (target = itself),
# interferers = draws from the far pool (same room preferred, speaker-disjoint), then
# the standard noise chain on top. This puts real captured speech on the KEEP side of
# the same kind of mixture whose far side is real: near and far then differ mainly in
# distance, so capture-chain identity is useless as a cue.
augmentation_realnear:
  used: True
  prob: 0.15
  turn_taking_prob: 0.5   # half of these rows become conversational turns: multi-second
                          # far-solo stretches with real near speech elsewhere in the
                          # clip, i.e. absolute contrast within one capture chain
  pool_manifest: data/realfar_pool/voices.near.train.jsonl
  stitch_to_length: True

# Session rows: one user, one or two bystanders, a script of who talks when, and
# the row's own floor in the gaps. See the header for the rates and
# puresound/task/session_rows.py for the contracts (one chain draw per row; a
# gap is floor, never digital silence; a long user gap is never target-absent).
# Disabled, or on a row shorter than min_seconds, this block draws nothing.
augmentation_session_rows:
  enabled: True
  prob: 0.5
  min_seconds: 12.0        # the 12 s and 30 s buckets; short buckets untouched
  max_seconds: 60.0        # no-op today -- the cap item 5 of the review asked for
  n_bystanders: [1, 2]
  user_distance_range: [0.3, 1.0]        # the bank's near pool
  bystander_distance_range: [1.5, 4.0]   # the bank's far pool
  shape_probs:
    user_first: 0.25       # U opens, then they alternate
    bystander_first: 0.30  # B holds the floor 2-8 s, U enters (wrong anchor)
    user_gap: 0.30         # U speaks, 5-20 s of floor, U returns (persistence)
    overlap: 0.15          # boundary double talk throughout (the KEEP guard)
  user_turn_seconds: [1.5, 4.0]
  bystander_turn_seconds: [2.0, 4.5]
  bystander_open_seconds: [2.0, 8.0]
  user_gap_seconds: [5.0, 20.0]
  turn_gap_seconds: [0.2, 0.8]
  overlap_seconds: [0.5, 3.0]
  boundary_overlap_prob: 0.25
  bystander_in_gap_prob: 0.7   # "the user stepped away" vs "nobody is near"
  min_turn_seconds: 0.5
  max_turns: 16
  rir_move_prob: 0.3                     # U changes seat, same room, same chain
  distance_matched_bystander_prob: 0.2   # B in U's distance class
  # SIR for the bystander bus. The tail is a separate regime draw so its share
  # is a knob: P(SIR <= -5 dB) = 0.30 here against 0.05 realised in v16.
  sir_range: [-5.0, 10.0]
  sir_low_tail_prob: 0.30
  sir_low_tail_range: [-10.0, -5.0]
  # The forced capture floor, mirroring augmentation_noise.absolute_floor's
  # semantics (level as drawn, upstream of the device chain). Low on purpose: it
  # is a guarantee against digital silence in a gap, not a second noise source.
  floor_dbfs_range: [-60.0, -45.0]
  fade_samples: 400
  pair_prob: 0.25
  pair_pool_size: 256

augmentation_noise:
  used: True
  prob: 0.8
  noise_folder: /data/audio/dns-5/datasets_fullband_16k/noise_fullband
  snr_range:
    - 0
    - 20
  prob_white_noise: 0.1
  white_noise_snr_range:
    - 10
    - 30
  # Noise shares the speech's room, so the floor is spatially coherent with the
  # mixture instead of arriving dry from nowhere. prob 0.5 keeps half the rows
  # dry -- some real noise (hum, electrical) genuinely has no room, and the
  # contrast preserves diversity.
  room_coloring:
    used: True
    prob: 0.5
  # A capture floor anchored to digital full scale, not to the mixture: a
  # deployed mic's self-noise and room tone sit at a fixed level whoever is
  # speaking. -55..-35 dBFS against -28 dBFS speech spans the -8..-21 dB
  # speech-to-floor range measured on real recordings, plus a cleaner margin.
  # Mixture only; inherits the device chain like capsule noise.
  absolute_floor:
    used: True
    prob: 0.5
    level_dbfs_range: [-55, -35]

# Reverb from the pre-generated RIR bank (source-level: foreground = near channel,
# interferers = far channels of the SAME room).
augmentation_reverb:
  used: True
  prob: 1.
  rir_folder:
  # target_rir_type "early": the target is the early-reflection (de-reverbed) near
  # speech. full-RIR targets let passthrough match the target (near is dominant),
  # so "early" forces reverb-tail removal and keeps separation a real objective.
  target_rir_type: "early"
  simulator:
    used: True
    source_level: True
    pregenerated:
      used: True
      # Merged bank: simulated rooms plus measured-RIR rooms (~22% here) whose near
      # channels are all real <1 m impulse responses. The measured rooms widen the
      # keep-class channel manifold beyond a single simulated near signature.
      folder: /work/any_exp_link/puresound_exp/hybrid_rir_16k_realfar
      near_labels: [near_0, near_1]
      far_labels: [far_0, far_1, far_2]
      drr_window_ms: 2.5
      cache_size: 128

augmentation_speed:
  used: True
  prob: 0.5
  speed_range:
    - 0.95
    - 1.05

augmentation_ir_response:
  used: True
  prob: 0.3

augmentation_src:        # random down/up-sample (bandwidth variation). The 16000
  used: True             # entry is a no-op at target_sr 16k, so the effective
  prob: 0.5              # band-limiting rate is prob * P(8000) = 0.5 * 0.2 = 10%.
  src_range:
    - 8000
    - 16000
  prob_each:
    - 0.2
    - 0.8

# ON for the deployment recipe: real device mic front-ends commonly high-pass at 100-300 Hz.
augmentation_hpf:
  used: True
  prob: 0.25
  cutoff:
    - 100
    - 200
    - 300
  prob_each:
    - 0.4
    - 0.4
    - 0.2

augmentation_volume:
  used: True
  prob: 0.5
  perturbed_range:
    - 0.4
    - 1.6
  clipping_prob: 0.
  clipping_range:
    min:
      - 0.
      - 0.1
    max:
      - 0.9
      - 1.0

augmentation_codec:      # OFF (consumer-device realism; add incrementally if needed)
  used: False
  prob: 0.5
  codecs:
    - libopus
    - g722
  prob_each:
    - 0.7
    - 0.3
  bitrate_range:
    libopus:
      - 6000
      - 32000

augmentation_packet_loss:  # OFF (VoIP realism; add incrementally if needed)
  used: False
  prob: 0.3
  packet_ms_choices:
    - 20
    - 40
    - 60
  loss_rate_range:
    - 0.01
    - 0.10

# VAD is OFF (separation-only). Kept used:True with the cheap ENERGY backend ONLY
# so overlap_control has a gating labeler; no loss consumes these labels.
vad_label:
  used: True
  backend: energy
  args:
    frame_length: 400
    hop_length: 160

trainer:
  lightning_trainer_args:
    # STOPS AT A COSINE TROUGH ON ITS OWN, so the benchmark can be chained after
    # the training command instead of a watcher having to kill it -- the v15 round
    # lost 42 h of GPU to a watcher that died mid-pause. Was 20 for the first
    # cycle (ep19 beat v8 at every window; benchmarks/probes/v16 notes); 40 takes
    # the second. Resume with --ckpt_path, never a fresh warm start.
    max_epochs: 20   # ONE cosine cycle; ep19 is the trough v16 ep19 compares to
    gradient_clip_val: 5.
    accumulate_grad_batches: 2
    precision: bf16-mixed
  train_iter_per_epoch: 1000
  valid_iter_per_epoch: 100
  valid_seed: 1234
  n_spk_per_batch: 12          # validation batch; training uses the schedule
  # THE ROUND KNOB. n_spk travels with seconds because memory does (measured peak:
  # 3s x20 / 6s x12 19.2 / 12s x6 19.0 / 30s x2 16.9 GiB on a 22 GB card).
  length_schedule:
    - {seconds: 3.,  n_spk: 20, prob: 0.25}   # the cold-start regime
    - {seconds: 6.,  n_spk: 12, prob: 0.30}   # what every version to date trained on
    - {seconds: 12., n_spk: 6,  prob: 0.25}
    - {seconds: 30., n_spk: 2,  prob: 0.20}   # where v8's anchor accumulation lives
  n_utt_per_speaker: 1
  num_workers: 20
  num_gpus: 2
  find_unused_parameters: true
  work_folder: exp/dpcrn_v20_r1a

optimizer:
  type: AdamW
  learning_rate: 0.001
  args:
    weight_decay: 0.00001
    betas:
     - 0.9
     - 0.999

scheduler:
  # Warm restarts every T_0 epochs; compare runs only at the cosine troughs
  # (~ep19, ~ep39, ...) -- mid-cycle epochs are LR-perturbed and not comparable.
  type: CosineAnnealingWarmRestarts
  warmup_step: 250
  args:
    T_0: 20
    T_mult: 1
    eta_min: 0.00001

loss_func:
  - type: SDRLoss
    weighted: 1.
    args:
      scaled: False
      scale_dependent: True
      zero_mean: True
      source_aggregated: False
      sdr_max: 50
      threshold: -50

  - type: MultiResolutionSTFTLoss
    weighted: 0.5
    args:
      fft_sizes:
        - 512
        - 1024
        - 256
      hop_sizes:
        - 128
        - 256
        - 64
      win_lengths:
        - 512
        - 1024
        - 256
      window: hann_window
      factor_sc: 0.5
      factor_mag: 0.5

  # ANTI-SUPPRESSION: pure-magnitude one-sided loss = mean(ReLU(|T|^p - |E|^p)^2).
  # Penalises enhanced magnitude falling BELOW target (deletion); over-estimation is
  # already covered by SD-SDR + STFT above, so this adds net asymmetric pressure toward
  # preservation. `weighted` trades deletions against substitutions. Judge its effect
  # with a strong ASR: weak recognizers hide over-suppression.
  - type: OverSuppressionLoss
    weighted: 3.0
    args:
      p: 0.5
      fft_size: 512
      hop_size: 128
      win_length: 512

  # Training-only background accounting: residual = noisy - enhanced is supervised
  # against consistency_noise (= noisy - clean). Deployment stays single-output.
  - type: ResidualReferenceLoss
    weighted: 0.2
    args:
      reference_key: consistency_noise
      loss: l1
      target_present_only: True

  # ASR-aware perceptual loss: match enhanced features to the clean target's features
  # inside frozen 16 kHz SSL encoders, which penalises destroyed intelligibility that
  # signal losses alone do not see. Two encoders are stacked because they fail
  # differently: HuBERT carries general phonetic content, while WavLM is pretrained
  # with denoising and simulated overlapped speech and so reacts to the noise/overlap
  # conditions where deletion appears.
  # NOTE: both terms use `loss: cosine` on purpose. Cosine is scale-invariant, so the
  # two encoders' different feature magnitudes do not fight and equal weights really
  # mean equal influence; with `loss: l1` the weights would need rebalancing.
  - type: ASRFeatureLoss          # general phonetic content
    weighted: 1.0
    args:
      bundle: HUBERT_BASE
      layers: [6, 9]
      loss: cosine
      crop_seconds: 6.

  - type: ASRFeatureLoss          # noise/overlap-robust SSL features
    weighted: 1.0
    args:
      bundle: WAVLM_BASE_PLUS
      layers: [6, 9]
      loss: cosine
      crop_seconds: 6.

  # Pairs with backbone.dist_head: push the bottleneck to encode physical proximity
  # (DRR / log-distance) rather than the capture-chain signature. NaN-masked, so
  # simulated rows supervise all three targets and real rows only their distances.
  - type: DistHeadRegressionLoss
    weighted: 0.3
    args:
      drr_scale: 10.0
      min_dist: 0.1
      max_dist: 30.0

  # ------------------------------------------------------------------ #
  # R1a's other half. Both terms read the per-turn keys this recipe's data
  # emits -- user_active, bystander_active, turn_id, turn_role, turn_speaker,
  # turn_chain, row_source_id (puresound/task/session_rows.py,
  # SESSION_LABEL_KEYS) -- plus the graph-carrying `bottleneck` provider that
  # `backbone_args.expose_bottleneck: True` below materializes. Both are
  # graph-carrying zeros on a batch that has no session row, so the 3 s / 6 s
  # buckets contribute nothing and DDP still sees every head.
  #
  # Measured by CALLING both terms on 80 real batches of this recipe
  # (benchmarks/probes/v20_session_rows README §8.1): 0.3375 of batches carry a
  # session row, the identity term and the proximity ordering term are non-zero
  # on 0.325 of batches, and the proximity CONSISTENCY term on 0.000 -- no two
  # rows sharing a row_source_id land in one batch at these knobs (README §4.2
  # has the arithmetic and the fix: a queue keyed on row_source_id, or a
  # pair_pool_size of order the paired rows per batch). consistency_weight is
  # left at 1.0 so that turning the pair rate up is a data change and not also
  # a loss change.
  - type: IdentityContrastiveLoss
    weighted: 0.1
    args:
      temperature: 0.1
      momentum: 0.99          # stop-gradient EMA teacher, a copy of the head
      min_turn_frames: 1      # the generator drops a turn with no exposed frame

  - type: RelativeProximityLoss
    weighted: 0.1
    args:
      margin: 1.0             # in the head's own units; only differences are supervised
      consistency_weight: 1.0
      min_turn_frames: 1
  # ------------------------------------------------------------------ #

model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      # Per-term loss curves: False in both shipped recipes, so the curves this
      # round promises to read would otherwise never be emitted.
      verbose: True
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
      # Whole-mix EQ/gain perturbation with a mask-consistency penalty: changing the
      # recording chain must not change the keep/suppress decision.
      channel_consistency:
        enabled: True
        prob: 0.3
        weight: 1.0
        eq_db: 6.0
        gain_db: 4.0
        max_rows: 4       # sub-batch for the second forward (a full batch doubles
                        # peak activation memory; a regularizer does not need it)
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256
    # bins. backbone_args adapted from egs/noise_suppression/config/dpcrn.yaml.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 32, 64, 128]   # widened encoder/decoder stack (~1M params total)
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30 ms) look-ahead; inter-RNN stays unidirectional
      rnn_hidden: 96
      spectral_compress: False
      # Utterance-level distance/DRR regression head off the bottleneck. Training-only:
      # inference and the streaming export never read it. Labels are the scalars the
      # dataset already emits, NaN-masked in DistHeadRegressionLoss.
      dist_head:
        enabled: True
        hidden: 128
      # R1a's two per-frame heads. Training-only in the v11 pattern: nothing in
      # the inference or the streaming path reads them, so the deployed output
      # is bit-identical to v16's, and with the blocks absent the backbone
      # forward has no extra parameters and no extra ops at all.
      identity_head:
        enabled: True
        dim: 64            # the width IdentityContrastiveLoss compares
        kernel_t: 5        # 50 ms of causal context; the loss pools a whole turn
      proximity_head:
        enabled: True
        hidden: 64         # kernel_t is the identity head's, deliberately not a knob
      # The frequency-pooled bottleneck WITH its graph, which the identity
      # loss's EMA teacher needs (it runs its own copy of the head over the
      # features). A build-time flag, separate from the detached
      # `stash_bottleneck` probe the presence gate reads.
      expose_bottleneck: True
