# voice_isolate -- DPCRN inference config. Shared by ALL 6 pipeline checkpoints in ../pretrained_ckpt/
# (curriculum_core/expand, antisup_w1/w2/w3, wide_antisup): the `model:` block never changed across the
# whole pipeline, so one inference config covers every stage -- pick the checkpoint via --ckpt /
# --checkpoint_path, or via the demo.py dropdown (scans trainer.work_folder below).
# Used by: scripts/demo.py (gradio), scripts/streaming_onnx.py (ONNX export), and any one-off enhance
# script that only needs to build the model (no augmentation/dataset needed for inference).
# trainer/optimizer/scheduler/loss_func below are unused placeholders, present only because the config
# loader (puresound.recipes.load_siso_recipe_config) requires the keys to exist.
dataset:
  target_sample_rate: 16000

trainer:
  work_folder: pretrained_ckpt

optimizer:
  type: AdamW
  learning_rate: 0.001
  args:
    weight_decay: 0.00001
    betas:
     - 0.9
     - 0.999

scheduler:
  type: CosineAnnealingWarmRestarts
  warmup_step: 250
  args:
    T_0: 20
    T_mult: 1
    eta_min: 0.00001

loss_func: []

model:
  lighting_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256 bins.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 32, 64, 128]
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30ms) look-ahead; matches every pipeline ckpt except train_dpcrn_wide_causal.yaml (untrained, delay=[0,0,0])
      rnn_hidden: 96
      spectral_compress: False
