# voice_isolate -- DPCRN inference config WITH the presence heads exported.
#
# Same separator as infer_dpcrn.yaml -- identical weights, identical audio. The
# only difference is that the two per-frame presence heads are built, so the
# streaming export emits their logits as extra graph outputs:
#
#     vad_logit             per frame, pre-sigmoid: "a near user is talking now"
#     background_vad_logit  per frame, pre-sigmoid: "non-target speech is present"
#
# SIDE INFORMATION ONLY. The graph never applies them to the audio, so the
# enhanced output is byte-identical to infer_dpcrn.yaml. What consumes them
# decides what they mean.
#
# READ THIS BEFORE GATING ON THEM (measured on the four-actuator run):
#   * near head: 0.953 in-domain across RT60, 0.843 on a held-out device
#     orientation -- but INVERTED (0.253) on the QVF publication chain, where its
#     far span is the isolated bystander every version passes through.
#   * background head: 0.475 on real recordings, inverted on four groups. The
#     joint (near=0, bg=1) state -- the only one that licenses closing a gate --
#     fires on 15.9% of lone-bystander frames while 57.8% read as "user only".
#   * all three actuators measured: PresenceGate moved suppression 0.03 dB, soft
#     gating cost every keep clip its bit-identity and broke a double-talk clip,
#     hard gating deleted a keep span by 61.58 dB.
# The logits are worth exporting as a signal. Gating the audio on them is not
# supported by any measurement yet.
#
# The heads carry a 4-tap EMA bank, so the graph gains three state ports each
# (ema / conv_cache / count). `streaming_delay_frames` does NOT apply to them:
# a logit describes the bottleneck frame it came from, which LEADS the emitted
# audio by that delay.

schema_version: 2
purpose: inference
task: voice_isolation

dataset:
  target_sample_rate: 16000

trainer:
  work_folder: pretrained_ckpt

model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256 bins.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 32, 64, 128]
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30ms) look-ahead; matches every pipeline ckpt except train_dpcrn_wide_causal.yaml (untrained, delay=[0,0,0])
      rnn_hidden: 96
      spectral_compress: False
      vad_head:
        enabled: True
        ema_taus_s: [0.05, 0.25, 1.0, 4.0]
      background_vad_head:
        enabled: True
        ema_taus_s: [0.05, 0.25, 1.0, 4.0]
