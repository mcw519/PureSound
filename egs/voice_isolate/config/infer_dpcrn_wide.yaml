# voice_isolate -- wider DPCRN inference config, for dpcrn_curriculum_v2.
#
# Same model as infer_dpcrn.yaml except the width: channels [2, 48, 96, 128] and
# rnn_hidden 128 (1.20M parameters against 0.80M; streaming CPU RTF about 1.4x
# dpcrn_curriculum_v1). The released-checkpoint notes in infer_dpcrn.yaml -- dry_blend 0.9,
# training-only heads skipped on load -- apply here unchanged.
schema_version: 2
purpose: inference
task: voice_isolation

dataset:
  target_sample_rate: 16000

trainer:
  work_folder: pretrained_ckpt

model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256 bins.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 48, 96, 128]
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30ms) look-ahead; matches every released checkpoint
      rnn_hidden: 128
      spectral_compress: False
