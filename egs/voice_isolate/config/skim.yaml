dataset:
  train_metafile: ./data/voice_isolate_train
  valid_metafile: ./data/voice_isolate_valid
  test_folder: ./data/test
  proc_output_folder: ./proc
  target_sample_rate: 16000
  gain_nomalized_to: -28
  training_length_seconds: 6.
  filter_min_utterance_length: 4.
  filter_min_utterance_per_speaker: 5.

# The first sampled speaker in each item is treated as the near-field foreground
# voice. Other sampled speakers are far-field interferers to suppress.
augmentation_speech:
  used: True
  is_target: False
  prob: 1.
  add_n_cases: 2
  snr_range:
    - -5
    - 15

augmentation_noise:
  used: False
  prob: 0.5
  noise_folder:
  snr_range:
    - 0
    - 20
  prob_white_noise: 0.1
  white_noise_snr_range:
    - 10
    - 30

augmentation_reverb:
  used: True
  prob: 1.
  rir_folder:
  target_rir_type: "early" # ["full", "early", "direct", "anechoic"]
  simulator:
    used: True
    source_level: True
    room_dim_range:
      - [3.0, 8.0]
      - [3.0, 8.0]
      - [2.4, 3.5]
    rt60_range: [0.15, 0.8]
    source_receiver_distance_range: [0.3, 5.0]
    foreground_distance_range: [0.3, 1.0]
    interferer_distance_range: [1.5, 5.0]
    receiver_margin: 0.4
    source_margin: 0.4
    nsample: 4096
    order: -1
    hp_filter: True

augmentation_speed:
  used: False
  prob: 0.5
  speed_range:
    - 0.95
    - 1.05

augmentation_ir_response:
  used: False
  prob: 0.5

augmentation_src:
  used: False
  prob: 0.5
  src_range:
    - 8000
    - 16000
    - 24000
  prob_each:
    - 0.2
    - 0.6
    - 0.2

augmentation_hpf:
  used: False
  prob: 0.25
  cutoff:
    - 100
    - 200
    - 300
  prob_each:
    - 0.4
    - 0.4
    - 0.2

augmentation_volume:
  used: False
  prob: 0.5
  perturbed_range:
    - 0.4
    - 1.2
  clipping_prob: 0.1
  clipping_range:
    min:
      - 0.
      - 0.1
    max:
      - 0.9
      - 1.0

vad_label:
  used: True
  backend: silero
  args:
    frame_length: 400
    hop_length: 160
    threshold: 0.5
    min_overlap: 0.5
    model_sample_rate: 16000

trainer:
  lighting_trainer_args:
    max_epochs: 100
    gradient_clip_val: 5.
    accumulate_grad_batches: 1
  train_iter_per_epoch: 1000
  valid_iter_per_epoch: 200
  n_spk_per_batch: 4
  n_utt_per_speaker: 2
  num_workers: 8
  num_gpus: 1
  work_folder: ./exp/skim_near_field

optimizer:
  type: AdamW
  learning_rate: 0.0003
  args:
    weight_decay: 0.00001
    betas:
     - 0.9
     - 0.999

scheduler:
  type: StepLR
  warmup_step: 4000
  args:
    step_size: 10
    gamma: 0.5

loss_func:
  - type: SDRLoss
    weighted: 1.
    args:
      scaled: False
      scale_dependent: False
      zero_mean: True
      source_aggregated: False
      sdr_max: 50
      threshold: -50

  - type: MultiResolutionSTFTLoss
    weighted: 0.5
    args:
      fft_sizes:
        - 512
        - 1024
        - 256
      hop_sizes:
        - 128
        - 256
        - 64
      win_lengths:
        - 512
        - 1024
        - 256
      window: hann_window
      factor_sc: 0.5
      factor_mag: 0.5

  - type: VADActivityLoss
    weighted: 0.1
    args:
      frame_length: 400
      hop_length: 160
      activity_threshold_db: -40
      false_positive_weight: 2.0
      false_negative_weight: 1.0

model:
  lighting_module:
    type: EncDecMaskBase
    module_args:
      mask_type: mapping
      encoder_lr_factor: 1.
      feats_lr_factor: 1.
      backbone_lr_factor: 1.
  encoder:
    type: FreeEncDec
    encoder_args:
      win_length: 512
      laten_length: 512
      hop_length: 128
      output_active: ReLU
  features:
    feats_type: shrink_channel
    drop_stft_first_bin: False
    trainable: False
    include_specaug: False
  backbone:
    type: SkiM
    backbone_args:
      input_size: 512
      hidden_size: 256
      output_size: 512
      n_blocks: 4
      seg_size: 32
      seg_overlap: True
      causal: True
      dropout: 0.0
