        processor: stft_frame_ort
        sha256: 9a79e9eaeab9a6e288fec7216adb1c87a05b557948e8aa014f5f6096e1f375e4

  - id: noise-suppression-dpcrn-mamba-v3
    display_name: Noise Suppression DPCRN-Mamba v3
    task: noise_suppression
    lifecycle: released
    roles: [candidate]
    description: "Wider 16 kHz streaming DPCRN-Mamba with mixed-source coverage training and MetricGAN calibration. Higher PESQ and STOI than v2; lower DNSMOS OVR and slower CPU inference. Deletion gates remain unresolved, and hard-set WER is above the unprocessed input."
    inputs: [audio]
    outputs: [audio]
    audio: {sample_rate: 16000, channels: 1}
    capabilities: {offline_file: true, realtime_streaming: true, auxiliary_heads: false}
    preprocessing: {mono: true, resample: 16000}
    postprocessing: {type: manifest_recommended}
    recommended_inference: {dry_blend: 1.0}
    parameters:
      dry_blend: {type: float, default: 1.0, minimum: 0.1, maximum: 1.0, description: "Records were scored at 1.0 (no relief); lower values cap the suppression depth and are unmeasured."}
      onset_guard: {type: bool, default: false, description: "Keep the input untouched until a talker has been heard for t_arm_s of speech; fewer deleted words, less suppression in the first second."}
      onset_guard_t_arm_s: {type: float, default: 1.0, minimum: 0.3, maximum: 5.0, description: "Sustained speech that confirms a talker and hands the output over to the model."}
      onset_guard_t_forget_s: {type: float, default: 5.0, minimum: 1.0, maximum: 60.0, description: "Quiet this long drops the anchor, so the next onset is protected again."}
      onset_guard_tau_dn_s: {type: float, default: 2.0, minimum: 0.1, maximum: 10.0, description: "Release time constant from the untouched input back to the model output."}
      onset_guard_margin_db: {type: float, default: 8.0, minimum: 3.0, maximum: 20.0, description: "How far over the tracked noise floor a frame counts as speech."}
    source_checkpoint: egs/noise_suppression/pretrained_ckpt/dpcrn_mamba_v3.ckpt
    source_config: egs/noise_suppression/config/infer_dpcrn_mamba_wide.yaml
    benchmark_references: [egs/noise_suppression/pretrained_ckpt/README.md, egs/noise_suppression/benchmarks/records/ns_dpcrn-mamba_capWL3_mg_ep3.json]
    artifacts:
      - format: onnx
        variant: default
        path: egs/noise_suppression/pretrained_ckpt/streaming/dpcrn_mamba_v3.onnx
        manifest: egs/noise_suppression/pretrained_ckpt/streaming/dpcrn_mamba_v3.json
        processor: stft_frame_ort
        sha256: 8651656ab57af7ad33f0a67aa131df4c160767c56e8563043a59e77ea97dcfe9
      - format: onnx
        variant: flash
        path: egs/noise_suppression/pretrained_ckpt/streaming/dpcrn_mamba_v3_flash.onnx
        manifest: egs/noise_suppression/pretrained_ckpt/streaming/dpcrn_mamba_v3_flash.json
        processor: stft_frame_ort
        sha256: 2aab1b01855919e24b5b59d801bb9a655c617ea43208a0d1ac676888ffdb7dcf
        description: "int8 weights for tight CPU budgets: about 20% less CPU time than the default graph, PESQ about 0.005 lower, no resolvable change in word deletions."

  - id: noise-suppression-dpcrn-mamba-v2
    display_name: Noise Suppression DPCRN-Mamba v2
