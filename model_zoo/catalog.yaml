# The registry is intentionally metadata-only.  ONNX binaries and checkpoints
# stay in their existing task directories; update the SHA256 whenever an
# artifact is replaced in place.
models:
  - id: voice-isolate-dpcrn-v6
    display_name: Voice Isolation DPCRN v6
    task: voice_isolation
    lifecycle: released
    roles: [fallback]
    description: Legacy streaming DPCRN export without manifest post-processing.
    inputs: [audio]
    outputs: [audio]
    audio: {sample_rate: 16000, channels: 1}
    capabilities: {offline_file: true, realtime_streaming: true, auxiliary_heads: false}
    preprocessing: {mono: true, resample: 16000}
    postprocessing: {type: manifest_recommended}
    recommended_inference: {dry_blend: 1.0}
    parameters:
      dry_blend: {type: float, default: 1.0, minimum: 0.1, maximum: 1.0}
    source_checkpoint: egs/voice_isolate/pretrained_ckpt/dpcrn_v6.ckpt
    source_config: egs/voice_isolate/config/infer_dpcrn.yaml
    benchmark_references: [egs/voice_isolate/pretrained_ckpt/README.md]
    artifacts:
      - format: onnx
        variant: default
        path: egs/voice_isolate/pretrained_ckpt/streaming/dpcrn_v6.onnx
        manifest: egs/voice_isolate/pretrained_ckpt/streaming/dpcrn_v6.json
        processor: stft_frame_ort
        sha256: 9f1ac2b9455fa7201723cb9ac5ad513b2b7417c2212a283cb399e7ad416e9274

