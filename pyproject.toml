[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puresound"
version = "0.1.0"
description = "A speech processing toolkit based on PyTorch for speech research"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Milo Wu" },
]
dependencies = [
  "google",
  "protobuf",
  "torch==2.6.0+cu124; sys_platform != 'darwin'",
  "torchaudio==2.6.0+cu124; sys_platform != 'darwin'",
  "torchcodec==0.2.1+cu124; sys_platform != 'darwin'",
  "torch==2.6.0; sys_platform == 'darwin'",
  "torchaudio==2.6.0; sys_platform == 'darwin'",
  "torchcodec==0.2.1; sys_platform == 'darwin'",
  "matplotlib",
  "numpy",
  "scipy",
  "scikit-learn",
  "tqdm",
  "tensorboard",
  "packaging",
  "pydantic>=2.11,<3",
  "PyYAML",
  "pesq",
  "pystoi",
  "mir_eval",
  "rir-generator",
  "plotly",
  "pandas",
  "kaleido",
  "lightning",
  "gradio",
  "onnx",
  "requests",
  "silero-vad",
  "librosa",
  "torchmetrics",
  "pyarrow>=24.0.0",
  "jiwer>=4.0.0",
]

[project.scripts]
puresound = "puresound.cli:main"

[project.optional-dependencies]
cpu = [
  "onnxruntime>=1.24,<2; sys_platform != 'darwin'",
  # ORT 1.24+ arm64 wheels require macOS 14; keep macOS 13 compatible.
  "onnxruntime==1.23.2; sys_platform == 'darwin'",
]
cuda = [
  "onnxruntime-gpu==1.24.1; sys_platform != 'darwin'",
]
asr = [
  # faster-whisper requires the CPU `onnxruntime` distribution by name and
  # therefore cannot share an environment with the CUDA ORT wheel.
  "faster-whisper>=1.2.1",
]
hybrid-rir = [
  "pyroomacoustics",
]
hybrid-rir-gpu = [
  "pyroomacoustics",
  "cupy-cuda12x",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist>=3.8.0",
  "ruff",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]
torchcodec = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "cuda" }],
  [{ extra = "asr" }, { extra = "cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools.packages.find]
include = ["puresound*"]

[tool.setuptools.package-data]
puresound = ["web/static/*"]

[tool.pytest.ini_options]
norecursedirs = ["_internal"]
markers = [
  "src",
  "nnet",
  "backbone",
  "audio_func",
  "slow: heavy physics/bank tests; excluded by `run_repo_checks.py --suite standard`",
]
filterwarnings = [
  "ignore:Call to deprecated create function FieldDescriptor",
  "ignore:Call to deprecated create function Descriptor",
  "ignore:Call to deprecated create function EnumDescriptor",
  "ignore:Call to deprecated create function EnumValueDescriptor",
  "ignore:Call to deprecated create function FileDescriptor",
  "ignore:Call to deprecated create function OneofDescriptor",
  "ignore:`np.object` is a deprecated alias for the builtin `object`",
  "ignore:`np.bool` is a deprecated alias for the builtin `bool`",
  "ignore::DeprecationWarning",
]

[tool.ruff]
# Third-party checkouts are not ours to lint.
extend-exclude = ["puresound/third_party"]

[tool.ruff.lint]
# F/E9 are the correctness rules the repo enforces everywhere; the wider style
# families stay advisory. E402 is excluded because scripts under egs/ use the
# sys.path-then-import pattern by design.
select = ["F", "E9"]
