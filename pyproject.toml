[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puresound"
version = "0.1.0"
description = "A speech processing toolkit based on PyTorch for speech research"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
  { name = "Milo Wu" },
]
dependencies = [
  "google",
  "protobuf",
  "torch==2.14.0+cu126; sys_platform != 'darwin'",
  "torchaudio==2.11.0+cu126; sys_platform != 'darwin'",
  "torchcodec==0.16.0+cu126; sys_platform != 'darwin'",
  "torch==2.14.0; sys_platform == 'darwin'",
  "torchaudio==2.11.0; sys_platform == 'darwin'",
  "torchcodec==0.16.0; sys_platform == 'darwin'",
  "matplotlib",
  "numpy",
  "scipy",
  "soundfile",
  "scikit-learn",
  "tqdm",
  "tensorboard",
  "packaging",
  "pydantic>=2.11,<3",
  "PyYAML",
  "pesq",
  "pystoi",
  "mir_eval",
  "rir-generator",
  "plotly",
  "pandas",
  "kaleido",
  "lightning>=2.6.6",
  "gradio>=6.16.0",
  "onnx",
  "requests",
  "silero-vad",
  "librosa",
  "torchmetrics",
  "pyarrow>=24.0.0",
  "jiwer>=4.0.0",
]

[project.scripts]
puresound = "puresound.cli:main"

[project.optional-dependencies]
cpu = [
  "onnxruntime>=1.24,<2; sys_platform != 'darwin'",
  # ORT 1.24+ arm64 wheels require macOS 14; keep macOS 13 compatible.
  "onnxruntime==1.23.2; sys_platform == 'darwin'",
]
cuda = [
  "onnxruntime-gpu==1.24.1; sys_platform != 'darwin'",
]
asr = [
  # faster-whisper requires the CPU `onnxruntime` distribution by name and
  # therefore cannot share an environment with the CUDA ORT wheel.
  "faster-whisper>=1.2.1",
]
aicoustics = [
  # Optional application comparator; never required by sampling or training.
  "aic-sdk==3.3.0",
]
hybrid-rir = [
  "pyroomacoustics",
]
hybrid-rir-gpu = [
  "pyroomacoustics",
  "cupy-cuda12x",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist>=3.8.0",
  "ruff",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchcodec = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[tool.uv]
# Security floors for transitive dependencies flagged by Dependabot.
constraint-dependencies = [
  "anyio>=4.14.2",
  "fsspec>=2026.6.0",
  "msgpack>=1.2.1",
  "multidict>=6.9.1",
  "pytorch-lightning>=2.6.6",
  "setuptools>=83.0.0",
  "soupsieve>=2.9.0",
  "urllib3>=2.8.0",
  "werkzeug>=3.1.9",
]
conflicts = [
  [{ extra = "cpu" }, { extra = "cuda" }],
  [{ extra = "asr" }, { extra = "cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["puresound*"]
# Without this, setuptools treats every directory in the tree as a PEP 420
# namespace package and walks all of it -- egs/, exp/, the RIR banks -- on
# every build.  Package discovery went from minutes to instant.  Nothing
# here is a namespace package; puresound/web/static is web assets and ships
# via package-data below.
namespaces = false

[tool.setuptools.package-data]
puresound = [
  "streaming/native/*.cc",
  "streaming/native/include/*.h",
  "streaming/native/include/LICENSE",
  "streaming/native/include/README.md",
  "web/static/*",
  "web/static/css/*",
  "web/static/fonts/*",
  "web/static/samples/*",
  "web/static/samples/pipeline/*",
  "web/static/samples/pipeline/noise/*",
  "web/static/samples/pipeline/rooms/items/*",
  "web/static/vendor/fflate/*",
  "web/static/device/*",
  "web/static/device/runtime/*",
  "web/static/device/assets/*",
  "web/static/device/vendor/ort/*",
  "web/static/vendor/three/*",
  "web/static/vendor/three/addons/controls/*",
]

[tool.pytest.ini_options]
norecursedirs = ["_internal"]
markers = [
  "src",
  "nnet",
  "backbone",
  "audio_func",
  "slow: heavy physics/bank tests; excluded by `run_repo_checks.py --suite standard`",
]
filterwarnings = [
  "ignore:Call to deprecated create function FieldDescriptor",
  "ignore:Call to deprecated create function Descriptor",
  "ignore:Call to deprecated create function EnumDescriptor",
  "ignore:Call to deprecated create function EnumValueDescriptor",
  "ignore:Call to deprecated create function FileDescriptor",
  "ignore:Call to deprecated create function OneofDescriptor",
  "ignore:`np.object` is a deprecated alias for the builtin `object`",
  "ignore:`np.bool` is a deprecated alias for the builtin `bool`",
  "ignore::DeprecationWarning",
]

[tool.ruff]
# Third-party checkouts are not ours to lint.
extend-exclude = ["puresound/third_party"]

[tool.ruff.lint]
# F/E9 are the correctness rules the repo enforces everywhere; the wider style
# families stay advisory. E402 is excluded because scripts under egs/ use the
# sys.path-then-import pattern by design.
select = ["F", "E9"]
