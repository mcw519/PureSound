[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puresound-streaming"
version = "0.1.0"
description = "Portable PureSound streaming ONNX Runtime SDK"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
cpu = [
  "onnxruntime>=1.24,<2; sys_platform != 'darwin'",
  # ORT 1.24+ ships macOS wheels only for arm64 on macOS 14 (Darwin 23) and later.
  "onnxruntime>=1.24,<2; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and (platform_machine != 'arm64' or platform_release < '23')",
]
cuda = [
  "onnxruntime-gpu==1.24.1; sys_platform != 'darwin'",
]

[tool.setuptools.packages.find]
include = ["puresound_streaming*"]
