# Test fixture: egs/voice_isolate/config/infer_dpcrn_heads.yaml with the inter-frame
# path switched from LSTM to Mamba (inter_type: mamba), for the streaming parity tests.
schema_version: 2
purpose: inference
task: voice_isolation

dataset:
  target_sample_rate: 16000

trainer:
  work_folder: pretrained_ckpt

model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256 bins.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 32, 64, 128]
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30ms) look-ahead
      rnn_hidden: 96
      inter_type: mamba     # selective state-space model in place of the inter-frame LSTM
      mamba_args:
        d_state: 16
        d_conv: 4
        expand: 2
      spectral_compress: False
      vad_head:
        enabled: True
        ema_taus_s: [0.05, 0.25, 1.0, 4.0]
      background_vad_head:
        enabled: True
        ema_taus_s: [0.05, 0.25, 1.0, 4.0]
