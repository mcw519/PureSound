# Test fixture: a training recipe whose RIR bank is a release's train split (usage_role: train),
# so its validation dataset runs the train pipeline role too (validation_pipeline_role: train).
schema_version: 2
purpose: train
task: voice_isolation

dataset:
  train_metafile: data/dns5-read.train.list
  valid_metafile: data/dns5-read.dev.list
  test_folder: data/test
  proc_output_folder: proc
  target_sample_rate: 16000
  gain_normalized_to: -28
  training_length_seconds: 6.
  filter_min_utterance_length: 2
  filter_min_utterance_per_speaker: 1
  validation_pipeline_role: train

augmentation_reverb:
  used: True
  prob: 1.
  rir_folder:
  target_rir_type: "early"
  simulator:
    used: True
    source_level: True
    pregenerated:
      used: True
      bank_type: release
      folder: /path/to/path-events-m4_release
      recipe_id: synthetic_calibrated
      split: train
      usage_role: train
      require_production: False
      audit: False
      near_labels: [near_0, near_1]
      far_labels: [far_0, far_1, far_2]
      drr_window_ms: 2.5
      cache_size: 128

trainer:
  lightning_trainer_args:
    max_epochs: 100
    gradient_clip_val: 5.
    accumulate_grad_batches: 2
    precision: bf16-mixed
  train_iter_per_epoch: 1000
  valid_iter_per_epoch: 100
  valid_seed: 1234
  n_spk_per_batch: 12
  n_utt_per_speaker: 1
  num_workers: 20
  num_gpus: 2
  work_folder: exp/dpcrn_validation_pipeline_train

optimizer:
  type: AdamW
  learning_rate: 0.001
  args:
    weight_decay: 0.00001
    betas: [0.9, 0.999]

scheduler:
  type: CosineAnnealingWarmRestarts
  warmup_step: 250
  args:
    T_0: 20
    T_mult: 1
    eta_min: 0.00001

loss_func:
  - type: SDRLoss
    weighted: 1.
    args:
      scaled: False
      scale_dependent: True
      zero_mean: True
      source_aggregated: False
      sdr_max: 50
      threshold: -50

model:
  lightning_module:
    type: EncDecMaskBase
    module_args:
      mask_type: complex   # DPCRN emits a complex ratio mask applied to the noisy STFT
      encoder_lr_factor: 0.1
      feats_lr_factor: 0.1
      backbone_lr_factor: 1.
  encoder:
    type: ConvEncDec
    encoder_args:
      fft_length: 512
      win_type: "hann"
      win_length: 512
      hop_length: 160
      fmin: 0
      fmax: 8000
      sr: 16000
      trainable: False
  features:
    feats_type: complex
    drop_stft_first_bin: True
    trainable: False
    include_specaug: False
  backbone:
    # DPCRN (dual-path conv-recurrent, complex mask), 16k-native: fft 512 -> 256 bins.
    type: DPCRN
    backbone_args:
      input_dim: 256
      activation_type: PReLU
      norm_type: bN2d
      dropout: 0.05
      channels: [2, 32, 64, 128]
      transpose_t_size: 2
      transpose_delay: False
      skip_conv: False
      kernel_t: [2, 2, 2]
      stride_t: [1, 1, 1]
      dilation_t: [1, 1, 1]
      kernel_f: [5, 3, 3]
      stride_f: [2, 2, 1]
      dilation_f: [1, 1, 1]
      delay: [1, 1, 1]      # 3-frame (~30ms) look-ahead
      rnn_hidden: 96
      spectral_compress: False
